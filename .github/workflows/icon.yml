name: Inject Icon to APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (contoh: v1.0, calculator-oneui)'
        required: true
        default: 'v1.0'
      release_notes:
        description: 'Catatan release (opsional)'
        required: false
        default: 'APK with custom icon'

jobs:
  inject-icon:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install Pillow

      - name: Validate input files
        run: |
          echo "=== Isi folder input ==="
          ls -lh input/

          # Cek APK
          APK_COUNT=$(ls input/*.apk 2>/dev/null | wc -l)
          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERROR: Tidak ada file .apk di folder input/"
            exit 1
          fi
          if [ "$APK_COUNT" -gt 1 ]; then
            echo "ERROR: Lebih dari 1 file .apk ditemukan. Taruh 1 saja."
            exit 1
          fi

          # Cek icon foreground
          FG_COUNT=$(ls input/*foreground* 2>/dev/null | wc -l)
          if [ "$FG_COUNT" -eq 0 ]; then
            echo "ERROR: Tidak ada file *foreground* di folder input/"
            exit 1
          fi

          # Cek icon background
          BG_COUNT=$(ls input/*background* 2>/dev/null | wc -l)
          if [ "$BG_COUNT" -eq 0 ]; then
            echo "ERROR: Tidak ada file *background* di folder input/"
            exit 1
          fi

          echo "=== Validasi OK ==="
          echo "APK     : $(ls input/*.apk)"
          echo "FG Icon : $(ls input/*foreground*)"
          echo "BG Icon : $(ls input/*background*)"

      - name: Inject icon
        run: python scripts/inject_icon.py

      - name: Show output
        run: |
          echo "=== Output ==="
          ls -lh output/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag }}
          name: ${{ github.event.inputs.release_tag }}
          body: ${{ github.event.inputs.release_notes }}
          files: output/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
