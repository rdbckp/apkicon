name: Build Datura Firewall → Magisk Module

on:
  workflow_dispatch:
    inputs:
      module_version:
        description: 'Versi module (contoh: v1.0)'
        required: true
        default: 'v1.0'
      build_type:
        description: 'Tipe build APK'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

jobs:
  build-and-package:
    runs-on: ubuntu-latest

    steps:
      # ─────────────────────────────────────────
      # 1. CHECKOUT repo ini (tempat YML)
      # ─────────────────────────────────────────
      - name: Checkout this repo
        uses: actions/checkout@v4

      # ─────────────────────────────────────────
      # 2. CLONE source Firewall sementara
      # ─────────────────────────────────────────
      - name: Clone Datura Firewall source (temporary)
        run: |
          git clone --depth=1 --branch 11 \
            https://github.com/ProjectSakura/packages_apps_Firewall.git \
            firewall-src
          echo "✅ Cloned. Contents:"
          ls firewall-src/

      # ─────────────────────────────────────────
      # 3. SETUP JDK 11
      #    AGP 4.1.1 pakai Gradle 6.x → butuh JDK 11
      #    JDK 17 incompatible dengan Gradle 6.x
      # ─────────────────────────────────────────
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('firewall-src/**/*.gradle', 'firewall-src/**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      # ─────────────────────────────────────────
      # 4. FIX semua jcenter() → mavenCentral()
      #    di build.gradle, app/build.gradle,
      #    DAN settings.gradle
      # ─────────────────────────────────────────
      - name: Fix deprecated jcenter → mavenCentral
        working-directory: firewall-src
        run: |
          # Fix semua file gradle sekaligus
          find . -name "*.gradle" | xargs sed -i 's/jcenter()/mavenCentral()/g'
          echo "✅ Fixed files:"
          grep -rl "mavenCentral" . --include="*.gradle" | grep -v ".gradle/"

      # ─────────────────────────────────────────
      # 5. UPGRADE AGP + Gradle wrapper
      #    AGP 4.1.1 → 7.4.2 (stable, JDK 11 ok)
      #    Gradle wrapper 6.x → 7.6.4
      # ─────────────────────────────────────────
      - name: Upgrade AGP and Gradle wrapper
        working-directory: firewall-src
        run: |
          # Upgrade AGP di build.gradle
          sed -i "s/com.android.tools.build:gradle:[0-9.]*/com.android.tools.build:gradle:7.4.2/g" build.gradle
          echo "✅ AGP upgraded to 7.4.2"


          # Upgrade Gradle wrapper ke 7.6.4
          WRAPPER_PROPS="gradle/wrapper/gradle-wrapper.properties"
          sed -i 's|distributionUrl=.*|distributionUrl=https\://services.gradle.org/distributions/gradle-7.6.4-bin.zip|g' \
            $WRAPPER_PROPS
          # Hapus distributionSha256Sum — checksum lama bikin mismatch error
          sed -i '/distributionSha256Sum/d' $WRAPPER_PROPS
          echo "✅ Gradle wrapper 7.6.4, stale checksum removed"

          # Verify
          echo "--- build.gradle ---"
          cat build.gradle
          echo "--- gradle-wrapper.properties ---"
          cat $WRAPPER_PROPS


      # ─────────────────────────────────────────
      # 6. BUILD APK
      # ─────────────────────────────────────────
      - name: Grant execute permission for gradlew
        working-directory: firewall-src
        run: chmod +x gradlew

      - name: Build APK (${{ github.event.inputs.build_type }})
        working-directory: firewall-src
        run: |
          if [ "${{ github.event.inputs.build_type }}" = "release" ]; then
            ./gradlew assembleRelease --no-daemon --stacktrace
          else
            ./gradlew assembleDebug --no-daemon --stacktrace
          fi

      - name: Locate built APK
        id: find_apk
        working-directory: firewall-src
        run: |
          APK=$(find app/build/outputs/apk -name "*.apk" | head -1)
          if [ -z "$APK" ]; then
            echo "❌ APK not found! Build failed."
            exit 1
          fi
          FULL_PATH="$GITHUB_WORKSPACE/firewall-src/$APK"
          echo "apk_path=$FULL_PATH" >> $GITHUB_OUTPUT
          echo "✅ APK found: $FULL_PATH"

      # ─────────────────────────────────────────
      # 7. BUAT STRUKTUR MAGISK MODULE
      # ─────────────────────────────────────────
      - name: Create Magisk module structure
        run: |
          MODULE_DIR="magisk-module"

          mkdir -p $MODULE_DIR/META-INF/com/google/android
          mkdir -p $MODULE_DIR/system/priv-app/Firewall
          mkdir -p $MODULE_DIR/system/etc/permissions

          # ── module.prop ──
          cat > $MODULE_DIR/module.prop << EOF
          id=datura-firewall
          name=Datura Firewall (CalyxOS Port)
          version=${{ github.event.inputs.module_version }}
          versionCode=${{ github.run_number }}
          author=ProjectSakura
          description=CalyxOS Datura Firewall - per-app network control without VPN
          EOF

          # ── updater-script ──
          echo "#MAGISK" > $MODULE_DIR/META-INF/com/google/android/updater-script

          # ── update-binary ──
          cat > $MODULE_DIR/META-INF/com/google/android/update-binary << 'INSTALLER'
          #!/sbin/sh
          SKIPUNZIP=1
          unzip -o "$ZIPFILE" 'system/*' -d "$MODPATH" >&2
          unzip -o "$ZIPFILE" 'module.prop' -d "$MODPATH" >&2
          set_perm_recursive "$MODPATH/system/priv-app" root root 0755 0644
          set_perm_recursive "$MODPATH/system/etc/permissions" root root 0755 0644
          ui_print "- Datura Firewall installed as priv-app"
          ui_print "- Network policy permissions granted"
          ui_print "- Reboot required!"
          INSTALLER

          chmod +x $MODULE_DIR/META-INF/com/google/android/update-binary

          # ── privapp-permissions XML ──
          cat > $MODULE_DIR/system/etc/permissions/privapp-permissions-Firewall.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <permissions>
              <privapp-permissions package="org.calyxos.firewall">
                  <permission name="android.permission.MANAGE_NETWORK_POLICY"/>
                  <permission name="android.permission.OBSERVE_NETWORK_POLICY"/>
                  <permission name="android.permission.NETWORK_SETTINGS"/>
                  <permission name="android.permission.NETWORK_STACK"/>
                  <permission name="android.permission.READ_NETWORK_USAGE_HISTORY"/>
                  <permission name="android.permission.CONNECTIVITY_INTERNAL"/>
              </privapp-permissions>
          </permissions>
          EOF

          echo "✅ Module structure ready:"
          find $MODULE_DIR -type f

      # ─────────────────────────────────────────
      # 8. COPY APK KE MODULE
      # ─────────────────────────────────────────
      - name: Copy APK into module
        run: |
          cp "${{ steps.find_apk.outputs.apk_path }}" magisk-module/system/priv-app/Firewall/Firewall.apk
          echo "✅ APK size: $(du -sh magisk-module/system/priv-app/Firewall/Firewall.apk)"

      # ─────────────────────────────────────────
      # 9. ZIP JADI MAGISK MODULE
      # ─────────────────────────────────────────
      - name: Package as Magisk module zip
        run: |
          VERSION="${{ github.event.inputs.module_version }}"
          BUILD="${{ github.event.inputs.build_type }}"
          ZIP_NAME="DaturaFirewall-${VERSION}-${BUILD}-magisk.zip"

          cd magisk-module
          zip -r "../$ZIP_NAME" . -x "*.DS_Store" -x "__MACOSX/*"
          cd ..

          echo "zip_name=$ZIP_NAME" >> $GITHUB_ENV
          echo "✅ Zipped: $ZIP_NAME ($(du -sh $ZIP_NAME | cut -f1))"

      # ─────────────────────────────────────────
      # 10. UPLOAD ARTIFACTS
      # ─────────────────────────────────────────
      - name: Upload Magisk Module ZIP
        uses: actions/upload-artifact@v4
        with:
          name: DaturaFirewall-${{ github.event.inputs.module_version }}-magisk-module
          path: DaturaFirewall-*.zip
          retention-days: 14

      - name: Upload raw APK
        uses: actions/upload-artifact@v4
        with:
          name: DaturaFirewall-${{ github.event.inputs.module_version }}-apk-only
          path: ${{ steps.find_apk.outputs.apk_path }}
          retention-days: 7

      # ─────────────────────────────────────────
      # 11. SUMMARY
      # ─────────────────────────────────────────
      - name: Print build summary
        run: |
          echo "### ✅ Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Module Version | ${{ github.event.inputs.module_version }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build Type | ${{ github.event.inputs.build_type }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Magisk ZIP | \`${{ env.zip_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Run # | ${{ github.run_number }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Flash: Magisk Manager → Install → pilih ZIP → Reboot**" >> $GITHUB_STEP_SUMMARY
