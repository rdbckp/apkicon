name: Build Datura Firewall → Magisk Module

on:
  workflow_dispatch:
    inputs:
      module_version:
        description: 'Versi module (contoh: v1.0)'
        required: true
        default: 'v1.0'
      build_type:
        description: 'Tipe build APK'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

jobs:
  build-and-package:
    runs-on: ubuntu-latest

    steps:
      # ─────────────────────────────────────────
      # 1. CHECKOUT
      # ─────────────────────────────────────────
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ─────────────────────────────────────────
      # 2. SETUP JDK
      # ─────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      # ─────────────────────────────────────────
      # 3. FIX jcenter() → mavenCentral()
      #    (jcenter sudah mati sejak 2022)
      # ─────────────────────────────────────────
      - name: Fix deprecated jcenter → mavenCentral
        run: |
          sed -i 's/jcenter()/mavenCentral()/g' build.gradle
          # Fix app/build.gradle juga kalau ada
          if [ -f app/build.gradle ]; then
            sed -i 's/jcenter()/mavenCentral()/g' app/build.gradle
          fi
          echo "✅ jcenter replaced with mavenCentral"

      # ─────────────────────────────────────────
      # 4. BUILD APK
      # ─────────────────────────────────────────
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APK (${{ github.event.inputs.build_type }})
        run: |
          if [ "${{ github.event.inputs.build_type }}" = "release" ]; then
            ./gradlew assembleRelease
          else
            ./gradlew assembleDebug
          fi

      - name: Locate built APK
        id: find_apk
        run: |
          APK=$(find app/build/outputs/apk -name "*.apk" | head -1)
          if [ -z "$APK" ]; then
            echo "❌ APK not found! Build failed."
            exit 1
          fi
          echo "apk_path=$APK" >> $GITHUB_OUTPUT
          echo "✅ APK found: $APK"

      # ─────────────────────────────────────────
      # 5. BUAT STRUKTUR MAGISK MODULE
      # ─────────────────────────────────────────
      - name: Create Magisk module structure
        run: |
          MODULE_DIR="magisk-module"

          # Buat folder structure
          mkdir -p $MODULE_DIR/META-INF/com/google/android
          mkdir -p $MODULE_DIR/system/priv-app/Firewall
          mkdir -p $MODULE_DIR/system/etc/permissions

          # ── module.prop ──
          cat > $MODULE_DIR/module.prop << EOF
          id=datura-firewall
          name=Datura Firewall (CalyxOS Port)
          version=${{ github.event.inputs.module_version }}
          versionCode=${{ github.run_number }}
          author=ProjectSakura
          description=CalyxOS Datura Firewall - per-app network control without VPN
          EOF

          # ── updater-script (wajib ada tapi isinya cuma marker) ──
          echo "#MAGISK" > $MODULE_DIR/META-INF/com/google/android/updater-script

          # ── update-binary (installer script) ──
          cat > $MODULE_DIR/META-INF/com/google/android/update-binary << 'INSTALLER'
          #!/sbin/sh

          SKIPUNZIP=1

          # Extract files
          unzip -o "$ZIPFILE" 'system/*' -d "$MODPATH" >&2
          unzip -o "$ZIPFILE" 'module.prop' -d "$MODPATH" >&2

          # Set permissions
          # priv-app: folder 0755, APK 0644, owner root:root
          set_perm_recursive "$MODPATH/system/priv-app" root root 0755 0644
          # permissions XML: 0644
          set_perm_recursive "$MODPATH/system/etc/permissions" root root 0755 0644

          ui_print "- Datura Firewall installed as priv-app"
          ui_print "- Network policy permissions granted"
          ui_print "- Reboot required to take effect"
          INSTALLER

          chmod +x $MODULE_DIR/META-INF/com/google/android/update-binary

          # ── privapp-permissions XML ──
          cat > $MODULE_DIR/system/etc/permissions/privapp-permissions-Firewall.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <permissions>
              <privapp-permissions package="org.calyxos.firewall">
                  <permission name="android.permission.MANAGE_NETWORK_POLICY"/>
                  <permission name="android.permission.OBSERVE_NETWORK_POLICY"/>
                  <permission name="android.permission.NETWORK_SETTINGS"/>
                  <permission name="android.permission.NETWORK_STACK"/>
                  <permission name="android.permission.READ_NETWORK_USAGE_HISTORY"/>
                  <permission name="android.permission.CONNECTIVITY_INTERNAL"/>
              </privapp-permissions>
          </permissions>
          EOF

          echo "✅ Magisk module structure created"
          find $MODULE_DIR -type f

      # ─────────────────────────────────────────
      # 6. COPY APK KE MODULE
      # ─────────────────────────────────────────
      - name: Copy APK into module
        run: |
          cp "${{ steps.find_apk.outputs.apk_path }}" magisk-module/system/priv-app/Firewall/Firewall.apk
          echo "✅ APK copied: $(du -sh magisk-module/system/priv-app/Firewall/Firewall.apk)"

      # ─────────────────────────────────────────
      # 7. ZIP JADI MAGISK MODULE
      # ─────────────────────────────────────────
      - name: Package as Magisk module zip
        run: |
          VERSION="${{ github.event.inputs.module_version }}"
          BUILD="${{ github.event.inputs.build_type }}"
          ZIP_NAME="DaturaFirewall-${VERSION}-${BUILD}-magisk.zip"

          cd magisk-module
          zip -r "../$ZIP_NAME" . -x "*.DS_Store" -x "__MACOSX/*"
          cd ..

          echo "zip_name=$ZIP_NAME" >> $GITHUB_ENV
          echo "✅ Magisk module zipped: $ZIP_NAME ($(du -sh $ZIP_NAME | cut -f1))"

      # ─────────────────────────────────────────
      # 8. UPLOAD ARTIFACT — APK + MODULE ZIP
      # ─────────────────────────────────────────
      - name: Upload Magisk Module
        uses: actions/upload-artifact@v4
        with:
          name: DaturaFirewall-${{ github.event.inputs.module_version }}-magisk-module
          path: DaturaFirewall-*.zip
          retention-days: 14

      - name: Upload raw APK (opsional)
        uses: actions/upload-artifact@v4
        with:
          name: DaturaFirewall-${{ github.event.inputs.module_version }}-apk-only
          path: ${{ steps.find_apk.outputs.apk_path }}
          retention-days: 7

      # ─────────────────────────────────────────
      # 9. SUMMARY
      # ─────────────────────────────────────────
      - name: Print build summary
        run: |
          echo "### ✅ Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Module Version | ${{ github.event.inputs.module_version }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build Type | ${{ github.event.inputs.build_type }} |" >> $GITHUB_STEP_SUMMARY
          echo "| APK | \`${{ steps.find_apk.outputs.apk_path }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Magisk ZIP | \`${{ env.zip_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Run # | ${{ github.run_number }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Flash via Magisk Manager → Install from storage → pilih ZIP → Reboot**" >> $GITHUB_STEP_SUMMARY
