name: 2 - Build APK

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Run ID dari workflow "Prepare Project" (cek URL atau daftar run)'
        required: true
        type: number

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download prepared project (dari run ID tertentu)
        uses: actions/download-artifact@v4
        with:
          name: android-project-source
          run-id: ${{ github.event.inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Build Tools & Platform 34
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LongPressKill-debug-apk
          path: app/build/outputs/apk/debug/*.apk
