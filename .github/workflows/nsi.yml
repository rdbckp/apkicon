name: Build APK - NSI v4.6 - Overlay Service (Right Top)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Create Project Structure
        run: |
          mkdir -p app/src/main/java/com/freestyle/networkindicator
          mkdir -p app/src/main/res/values

          # 1. AndroidManifest.xml (Wajib Izin Overlay)
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <application android:label="NSI v4.6">
                  <service android:name=".OverlayService" android:exported="false" android:foregroundServiceType="dataSync" />
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # 2. OverlayService.kt (Jantung Overlay-nya)
          cat > app/src/main/java/com/freestyle/networkindicator/OverlayService.kt << 'EOF'
          package com.freestyle.networkindicator

          import android.app.Service
          import android.content.Context
          import android.content.Intent
          import android.graphics.Color
          import android.graphics.PixelFormat
          import android.net.TrafficStats
          import android.os.*
          import android.view.*
          import android.widget.TextView

          class OverlayService : Service() {
              private lateinit var wm: WindowManager
              private lateinit var tv: TextView
              private val handler = Handler(Looper.getMainLooper())

              override fun onCreate() {
                  super.onCreate()
                  wm = getSystemService(WINDOW_SERVICE) as WindowManager
                  tv = TextView(this).apply {
                      setTextColor(Color.WHITE)
                      setBackgroundColor(Color.parseColor("#80000000")) // BG Hitam transparan
                      textSize = 14f
                      setPadding(10, 5, 10, 5)
                  }

                  val params = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE,
                      PixelFormat.TRANSLUCENT
                  ).apply {
                      gravity = Gravity.TOP or Gravity.END
                      y = 100 // Jarak dari atas (atur sesuai posisi jam loe)
                  }

                  wm.addView(tv, params)
                  updateSpeed()
              }

              private fun updateSpeed() {
                  handler.post(object : Runnable {
                      override fun run() {
                          val rx = TrafficStats.getTotalRxBytes() / 1024
                          tv.text = "${rx % 9999}K/s"
                          handler.postDelayed(this, 1000)
                      }
                  })
              }

              override fun onDestroy() {
                  wm.removeView(tv)
                  super.onDestroy()
              }
              override fun onBind(i: Intent?) = null
          }
          EOF

          # 3. MainActivity.kt (Button buat Start Service)
          cat > app/src/main/java/com/freestyle/networkindicator/MainActivity.kt << 'EOF'
          package com.freestyle.networkindicator
          import android.app.Activity
          import android.content.Intent
          import android.os.Bundle
          import android.widget.Button
          class MainActivity : Activity() {
              override fun onCreate(b: Bundle?) {
                  super.onCreate(b)
                  val btn = Button(this).apply { text = "Start Overlay" }
                  btn.setOnClickListener { startService(Intent(this, OverlayService::class.java)) }
                  setContentView(btn)
              }
          }
          EOF

          # Tambahin setup build.gradle (kayak sebelumnya) ...
          echo "include ':app'" > settings.gradle
          # (Lanjutin build.gradle & setup java/android di bawah...)
      
      - name: Build and Upload
        # [Step build & upload sama persis kayak versi sebelumnya]
