name: Build APK - Network Indicator (Direct Service Start)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Create Project Structure & Code
        run: |
          mkdir -p app/src/main/java/com/network/speed
          mkdir -p app/src/main/res/values

          cat > app/src/main/res/values/strings.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">NetSpeed</string>
              <string name="notification_title">NetSpeed Active</string>
              <string name="notification_text">Service is running</string>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />

              <application
                  android:allowBackup="true"
                  android:icon="@android:drawable/stat_sys_download"
                  android:label="@string/app_name"
                  android:theme="@android:style/Theme.NoDisplay">
                  
                  <service
                      android:name=".OverlayService"
                      android:exported="true"
                      android:foregroundServiceType="dataSync" />
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/network/speed/OverlayService.kt << 'EOF'
          package com.network.speed

          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.app.Service
          import android.content.Intent
          import android.graphics.Color
          import android.graphics.PixelFormat
          import android.net.TrafficStats
          import android.os.Build
          import android.os.Handler
          import android.os.IBinder
          import android.os.Looper
          import android.provider.Settings
          import android.util.Log
          import android.view.Gravity
          import android.view.WindowManager
          import android.widget.TextView
          import androidx.core.app.NotificationCompat
          import java.util.Locale

          class OverlayService : Service() {
              private lateinit var windowManager: WindowManager
              private var overlayView: TextView? = null
              private val handler = Handler(Looper.getMainLooper())
              private var isActive = false
              private var lastRxBytes = 0L
              private var lastUpdateTime = 0L
              private val TAG = "OverlayService"

              companion object {
                  var isRunning = false
              }

              override fun onCreate() {
                  super.onCreate()
                  Log.d(TAG, "onCreate called")

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M && !Settings.canDrawOverlays(this)) {
                      Log.e(TAG, "No overlay permission. Requesting...")
                      // Coba minta izin via intent (meski di priv-app mungkin sudah diizinkan)
                      val intent = Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                          android.net.Uri.parse("package:$packageName"))
                      intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                      startActivity(intent)
                      stopSelf()
                      return
                  }

                  windowManager = getSystemService(WINDOW_SERVICE) as WindowManager
                  createOverlayView()
                  startForegroundNotification()
                  isActive = true
                  isRunning = true
                  lastRxBytes = TrafficStats.getTotalRxBytes()
                  lastUpdateTime = System.currentTimeMillis()
                  startUpdater()
                  Log.d(TAG, "Service started successfully")
              }

              private fun createOverlayView() {
                  val tv = TextView(this).apply {
                      text = "▼ 0 KB/s"
                      setTextColor(Color.BLACK)
                      setBackgroundColor(Color.parseColor("#AAFFFFFF"))
                      setPadding(8, 2, 8, 2)
                      textSize = 11f
                  }
                  overlayView = tv

                  val type = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O)
                      WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY
                  else
                      WindowManager.LayoutParams.TYPE_PHONE

                  val params = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      type,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                      PixelFormat.TRANSLUCENT
                  ).apply {
                      gravity = Gravity.TOP or Gravity.END
                      x = 0
                      y = 0
                  }

                  try {
                      windowManager.addView(tv, params)
                      Log.d(TAG, "Overlay view added at x=0, y=0, gravity=TOP|END")
                  } catch (e: Exception) {
                      Log.e(TAG, "Failed to add overlay", e)
                  }
              }

              private fun startForegroundNotification() {
                  val channelId = "net_speed"
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val channel = NotificationChannel(channelId, "Network Speed", NotificationManager.IMPORTANCE_LOW)
                      getSystemService(NotificationManager::class.java).createNotificationChannel(channel)
                  }

                  val notification = NotificationCompat.Builder(this, channelId)
                      .setContentTitle(getString(R.string.notification_title))
                      .setContentText(getString(R.string.notification_text))
                      .setSmallIcon(android.R.drawable.stat_sys_download)
                      .setPriority(NotificationCompat.PRIORITY_LOW)
                      .setOngoing(true)
                      .build()

                  startForeground(1, notification)
              }

              private fun startUpdater() {
                  val runnable = object : Runnable {
                      override fun run() {
                          if (!isActive) return
                          updateSpeed()
                          handler.postDelayed(this, 1000)
                      }
                  }
                  handler.post(runnable)
              }

              private fun updateSpeed() {
                  val now = System.currentTimeMillis()
                  val currentRx = TrafficStats.getTotalRxBytes()

                  if (lastRxBytes > 0 && lastUpdateTime > 0) {
                      val deltaRx = currentRx - lastRxBytes
                      val deltaTime = (now - lastUpdateTime) / 1000.0
                      if (deltaTime > 0) {
                          val downSpeed = deltaRx / deltaTime
                          val speedText = when {
                              downSpeed >= 1024 * 1024 -> String.format(Locale.US, "▼ %.1f MB/s", downSpeed / (1024 * 1024))
                              downSpeed >= 1024 -> String.format(Locale.US, "▼ %.0f KB/s", downSpeed / 1024)
                              else -> String.format(Locale.US, "▼ %.0f B/s", downSpeed)
                          }
                          overlayView?.text = speedText
                      }
                  }

                  lastRxBytes = currentRx
                  lastUpdateTime = now
              }

              override fun onDestroy() {
                  super.onDestroy()
                  Log.d(TAG, "onDestroy")
                  isActive = false
                  isRunning = false
                  handler.removeCallbacksAndMessages(null)
                  overlayView?.let { windowManager.removeView(it) }
              }

              override fun onBind(intent: Intent?): IBinder? = null
          }
          EOF

          cat > build.gradle << 'EOF'
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.1.1'
                  classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.0"
              }
          }
          allprojects { repositories { google(); mavenCentral() } }
          EOF

          cat > app/build.gradle << 'EOF'
          plugins { id 'com.android.application'; id 'kotlin-android' }
          android {
              namespace 'com.network.speed'
              compileSdk 34
              defaultConfig {
                  applicationId "com.network.speed"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = '17' }
          }
          dependencies {
              implementation "org.jetbrains.kotlin:kotlin-stdlib:1.9.0"
              implementation "androidx.core:core-ktx:1.12.0"
          }
          EOF

          echo "include ':app'" > settings.gradle
          echo "android.useAndroidX=true" > gradle.properties

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK Platform
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Generate Gradle Wrapper
        run: |
          wget https://services.gradle.org/distributions/gradle-8.1.1-bin.zip
          unzip -q gradle-8.1.1-bin.zip
          ./gradle-8.1.1/bin/gradle wrapper --gradle-version 8.1.1
          rm -rf gradle-8.1.1-bin.zip gradle-8.1.1

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NetSpeed-Direct
          path: app/build/outputs/apk/debug/*.apk
