name: Build APK - LongPress Back Kill (Reliable - Fixed)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Create Project
        run: |
          mkdir -p app/src/main/java/com/freestyle/longpresskill
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/xml

          cat > app/src/main/res/values/strings.xml << 'EOF'
          <resources>
              <string name="app_name">LongPress Kill</string>
              <string name="service_label">LongPress Back Kill</string>
              <string name="service_desc">Kill foreground app when back button is long pressed</string>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application android:label="@string/app_name" android:icon="@android:drawable/ic_menu_delete">
                  <service android:name=".KillService"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_config" />
                  </service>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/freestyle/longpresskill/KillService.kt << 'EOF'
          package com.freestyle.longpresskill

          import android.accessibilityservice.AccessibilityService
          import android.accessibilityservice.AccessibilityServiceInfo
          import android.app.ActivityManager
          import android.content.Context
          import android.os.Build
          import android.view.KeyEvent
          import android.view.accessibility.AccessibilityEvent

          class KillService : AccessibilityService() {

              override fun onServiceConnected() {
                  // Configure the accessibility service
                  val config = AccessibilityServiceInfo().apply {
                      eventTypes = AccessibilityEvent.TYPE_WINDOW_STATE_CHANGED
                      feedbackType = AccessibilityServiceInfo.FEEDBACK_GENERIC
                      flags = AccessibilityServiceInfo.FLAG_REQUEST_FILTER_KEY_EVENTS
                      notificationTimeout = 100
                  }
                  setServiceInfo(config)
              }

              override fun onKeyEvent(event: KeyEvent): Boolean {
                  if (event.keyCode == KeyEvent.KEYCODE_BACK && event.action == KeyEvent.ACTION_DOWN && event.isLongPress()) {
                      killForegroundApp()
                      return true
                  }
                  return super.onKeyEvent(event)
              }

              private fun killForegroundApp() {
                  try {
                      val am = getSystemService(Context.ACTIVITY_SERVICE) as ActivityManager
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.LOLLIPOP) {
                          val runningTasks = am.getRunningTasks(1)
                          val pkg = runningTasks.firstOrNull()?.topActivity?.packageName
                          if (pkg != null && pkg != packageName) {
                              // Force stop via shell
                              Runtime.getRuntime().exec(arrayOf("su", "-c", "am force-stop $pkg"))
                          }
                      }
                  } catch (e: Exception) {
                      e.printStackTrace()
                  }
              }

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {}
              override fun onInterrupt() {}
          }
          EOF

          cat > app/src/main/res/xml/accessibility_config.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagRequestFilterKeyEvents"
              android:canPerformGestures="false"
              android:canRetrieveWindowContent="false"
              android:description="@string/service_desc"
              android:notificationTimeout="100" />
          EOF

          cat > build.gradle << 'EOF'
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.1.1'
                  classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.0"
              }
          }
          allprojects { repositories { google(); mavenCentral() } }
          EOF

          cat > app/build.gradle << 'EOF'
          plugins { id 'com.android.application'; id 'kotlin-android' }
          android {
              namespace 'com.freestyle.longpresskill'
              compileSdk 34
              defaultConfig {
                  applicationId "com.freestyle.longpresskill"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = '17' }
          }
          dependencies {
              implementation "org.jetbrains.kotlin:kotlin-stdlib:1.9.0"
              implementation "androidx.core:core-ktx:1.12.0"
          }
          EOF

          echo "include ':app'" > settings.gradle
          echo "android.useAndroidX=true" > gradle.properties

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK Platform
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Generate Gradle Wrapper
        run: |
          wget https://services.gradle.org/distributions/gradle-8.1.1-bin.zip
          unzip -q gradle-8.1.1-bin.zip
          ./gradle-8.1.1/bin/gradle wrapper --gradle-version 8.1.1
          rm -rf gradle-8.1.1-bin.zip gradle-8.1.1

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LongPressKill-Fixed
          path: app/build/outputs/apk/debug/*.apk
