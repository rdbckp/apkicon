name: Build APK - NSI v4.1 - Single Line Icon

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Create Project Structure & Code
        run: |
          mkdir -p app/src/main/java/com/freestyle/networkindicator
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable

          # 1. strings.xml
          cat > app/src/main/res/values/strings.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">NSI</string>
              <string name="notif_channel">Network Speed</string>
              <string name="notif_title">Network Speed Indicator</string>
          </resources>
          EOF

          # 2. ic_placeholder.xml
          cat > app/src/main/res/drawable/ic_placeholder.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android"
              android:shape="rectangle">
              <size android:width="1dp" android:height="1dp" />
              <solid android:color="@android:color/transparent" />
          </shape>
          EOF

          # 3. AndroidManifest.xml
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />

              <application
                  android:allowBackup="true"
                  android:icon="@android:drawable/ic_menu_manage"
                  android:label="@string/app_name"
                  android:theme="@android:style/Theme.DeviceDefault.Light.DarkActionBar"
                  tools:ignore="UnusedAttribute">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:label="@string/app_name">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".SpeedService"
                      android:exported="false"
                      android:foregroundServiceType="dataSync" />

                  <receiver
                      android:name=".BootReceiver"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED" />
                          <action android:name="android.intent.action.QUICKBOOT_POWERON" />
                      </intent-filter>
                  </receiver>
              </application>
          </manifest>
          EOF

          # 4. MainActivity.kt
          cat > app/src/main/java/com/freestyle/networkindicator/MainActivity.kt << 'EOF'
          package com.freestyle.networkindicator

          import android.app.Activity
          import android.content.Intent
          import android.os.Build
          import android.os.Bundle
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.TextView

          class MainActivity : Activity() {
              private lateinit var statusText: TextView

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  val layout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(60, 80, 60, 60)
                  }

                  statusText = TextView(this).apply {
                      textSize = 16f
                      setPadding(0, 0, 0, 40)
                  }

                  val startBtn = Button(this).apply {
                      text = "Mulai"
                      setOnClickListener { startSpeedService(); updateStatus() }
                  }

                  val stopBtn = Button(this).apply {
                      text = "Hentikan"
                      setOnClickListener {
                          stopService(Intent(this@MainActivity, SpeedService::class.java))
                          updateStatus()
                      }
                  }

                  layout.addView(statusText)
                  layout.addView(startBtn)
                  layout.addView(stopBtn)
                  setContentView(layout)
              }

              override fun onResume() {
                  super.onResume()
                  updateStatus()
              }

              private fun startSpeedService() {
                  val intent = Intent(this, SpeedService::class.java)
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      startForegroundService(intent)
                  } else {
                      startService(intent)
                  }
              }

              private fun updateStatus() {
                  statusText.text = if (SpeedService.isRunning)
                      "Status: AKTIF ✅\n\nSpeed icon 1 baris di notification area SB."
                  else
                      "Status: MATI ❌"
              }
          }
          EOF

          # 5. BootReceiver.kt
          cat > app/src/main/java/com/freestyle/networkindicator/BootReceiver.kt << 'EOF'
          package com.freestyle.networkindicator

          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.os.Build

          class BootReceiver : BroadcastReceiver() {
              override fun onReceive(context: Context, intent: Intent) {
                  val i = Intent(context, SpeedService::class.java)
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      context.startForegroundService(i)
                  } else {
                      context.startService(i)
                  }
              }
          }
          EOF

          # 6. SpeedService.kt - SINGLE LINE icon (FONT MAKSIMAL sebesar jam)
          cat > app/src/main/java/com/freestyle/networkindicator/SpeedService.kt << 'EOF'
          package com.freestyle.networkindicator

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.app.Service
          import android.content.Intent
          import android.graphics.Bitmap
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Paint
          import android.graphics.Rect
          import android.graphics.Typeface
          import android.graphics.drawable.Icon
          import android.net.TrafficStats
          import android.os.Build
          import android.os.Handler
          import android.os.IBinder
          import android.os.Looper
          import java.util.Locale

          class SpeedService : Service() {

              private val handler = Handler(Looper.getMainLooper())
              private var active = false
              private var lastRxBytes = 0L
              private var lastTime = 0L

              private val paint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  color = Color.WHITE
                  typeface = Typeface.create("sans-serif-condensed", Typeface.BOLD)
                  textAlign = Paint.Align.CENTER
              }

              companion object {
                  var isRunning = false
                      private set
                  const val NOTIF_ID = 1
                  const val CHANNEL_ID = "nsi_speed"
                  const val ICON_SIZE = 96
              }

              override fun onCreate() {
                  super.onCreate()
                  createChannel()
                  startForeground(NOTIF_ID, buildNotification(makeIcon("--")))
                  active = true
                  isRunning = true
                  lastRxBytes = TrafficStats.getTotalRxBytes()
                  lastTime = System.currentTimeMillis()
                  scheduleUpdate()
              }

              private fun scheduleUpdate() {
                  handler.postDelayed(object : Runnable {
                      override fun run() {
                          if (!active) return
                          tick()
                          handler.postDelayed(this, 1000)
                      }
                  }, 1000)
              }

              private fun tick() {
                  val now = System.currentTimeMillis()
                  val rx = TrafficStats.getTotalRxBytes()
                  val dt = (now - lastTime) / 1000.0
                  if (lastRxBytes > 0 && dt > 0) {
                      val bps = (rx - lastRxBytes) / dt
                      val nm = getSystemService(NOTIFICATION_SERVICE) as NotificationManager
                      nm.notify(NOTIF_ID, buildNotification(makeIcon(formatSpeed(bps))))
                  }
                  lastRxBytes = rx
                  lastTime = now
              }

              /**
               * SINGLE LINE icon generator dengan font sebesar mungkin.
               * - maxWidth = 98% dari lebar icon (hampir penuh)
               * - startSize = 100% dari tinggi icon (maksimal)
               * - Auto-fit akan mengecilkan font jika teks terlalu lebar,
               *   namun tetap berusaha sebesar mungkin.
               */
              private fun makeIcon(label: String): Icon {
                  val bmp = Bitmap.createBitmap(ICON_SIZE, ICON_SIZE, Bitmap.Config.ARGB_8888)
                  val canvas = Canvas(bmp)
                  canvas.drawColor(Color.TRANSPARENT)

                  val maxWidth = ICON_SIZE * 0.98f   // lebar maksimal 98% icon
                  val startSize = ICON_SIZE.toFloat() // mulai dari 100% tinggi icon

                  paint.textSize = startSize
                  val measured = paint.measureText(label)
                  if (measured > maxWidth) {
                      paint.textSize = startSize * (maxWidth / measured)
                  }

                  val bounds = Rect()
                  paint.getTextBounds(label, 0, label.length, bounds)
                  val cx = ICON_SIZE / 2f
                  val cy = (ICON_SIZE / 2f) + (bounds.height() / 2f)

                  canvas.drawText(label, cx, cy, paint)

                  return Icon.createWithBitmap(bmp)
              }

              private fun formatSpeed(bps: Double): String = when {
                  bps >= 1024 * 1024 -> String.format(Locale.US, "%.1fM", bps / (1024 * 1024))
                  bps >= 1024        -> String.format(Locale.US, "%.0fK", bps / 1024)
                  else               -> String.format(Locale.US, "%.0fB", bps)
              }

              private fun buildNotification(icon: Icon): Notification {
                  val pi = PendingIntent.getActivity(
                      this, 0,
                      Intent(this, MainActivity::class.java),
                      PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                  )
                  return Notification.Builder(this, CHANNEL_ID)
                      .setSmallIcon(icon)
                      .setContentTitle(getString(R.string.notif_title))
                      .setContentText("")
                      .setContentIntent(pi)
                      .setOngoing(true)
                      .setOnlyAlertOnce(true)
                      .setVisibility(Notification.VISIBILITY_PUBLIC)
                      .build()
              }

              private fun createChannel() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val ch = NotificationChannel(
                          CHANNEL_ID,
                          getString(R.string.notif_channel),
                          NotificationManager.IMPORTANCE_LOW
                      ).apply {
                          setShowBadge(false)
                          enableVibration(false)
                          enableLights(false)
                      }
                      (getSystemService(NOTIFICATION_SERVICE) as NotificationManager)
                          .createNotificationChannel(ch)
                  }
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int =
                  START_STICKY

              override fun onDestroy() {
                  super.onDestroy()
                  active = false
                  isRunning = false
                  handler.removeCallbacksAndMessages(null)
              }

              override fun onBind(intent: Intent?): IBinder? = null
          }
          EOF

          # 7. build.gradle root
          cat > build.gradle << 'EOF'
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.1.1'
                  classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.0"
              }
          }
          allprojects { repositories { google(); mavenCentral() } }
          EOF

          # 8. app/build.gradle
          cat > app/build.gradle << 'EOF'
          plugins { id 'com.android.application'; id 'kotlin-android' }
          android {
              namespace 'com.freestyle.networkindicator'
              compileSdk 34
              defaultConfig {
                  applicationId "com.freestyle.networkindicator"
                  minSdk 23
                  targetSdk 34
                  versionCode 5
                  versionName "4.1"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = '17' }
          }
          dependencies {
              implementation "org.jetbrains.kotlin:kotlin-stdlib:1.9.0"
          }
          EOF

          echo "include ':app'" > settings.gradle
          echo "android.useAndroidX=false" > gradle.properties

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK Platform 34 & Build Tools
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Generate Gradle Wrapper
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.1.1-bin.zip
          unzip -q gradle-8.1.1-bin.zip
          ./gradle-8.1.1/bin/gradle wrapper --gradle-version 8.1.1
          rm -rf gradle-8.1.1-bin.zip gradle-8.1.1

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NSI-v4.1-debug
          path: app/build/outputs/apk/debug/*.apk
