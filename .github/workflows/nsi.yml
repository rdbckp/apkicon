name: Build APK - NSI v4.6 - Overlay Service (Right Top)

on:
  workflow_dispatch:
    inputs:
      gravity:
        description: 'Posisi overlay'
        required: true
        default: 'TOP_END'
        type: choice
        options:
          - TOP_END
          - TOP_START
          - TOP_CENTER
          - BOTTOM_END
          - BOTTOM_START
          - BOTTOM_CENTER
          - CENTER
      offset_y:
        description: 'Jarak vertikal dari anchor (px)'
        required: true
        default: '100'
        type: string
      offset_x:
        description: 'Jarak horizontal dari anchor (px)'
        required: true
        default: '0'
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install ImageMagick
        run: sudo apt-get install -y imagemagick

      - name: Create Project Structure
        env:
          GRAVITY: ${{ github.event.inputs.gravity }}
          OFFSET_Y: ${{ github.event.inputs.offset_y }}
          OFFSET_X: ${{ github.event.inputs.offset_x }}
        run: |
          mkdir -p app/src/main/java/com/freestyle/networkindicator
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi

          case "$GRAVITY" in
            TOP_END)       GRAVITY_CODE="Gravity.TOP or Gravity.END" ;;
            TOP_START)     GRAVITY_CODE="Gravity.TOP or Gravity.START" ;;
            TOP_CENTER)    GRAVITY_CODE="Gravity.TOP or Gravity.CENTER_HORIZONTAL" ;;
            BOTTOM_END)    GRAVITY_CODE="Gravity.BOTTOM or Gravity.END" ;;
            BOTTOM_START)  GRAVITY_CODE="Gravity.BOTTOM or Gravity.START" ;;
            BOTTOM_CENTER) GRAVITY_CODE="Gravity.BOTTOM or Gravity.CENTER_HORIZONTAL" ;;
            CENTER)        GRAVITY_CODE="Gravity.CENTER" ;;
          esac

          # Generate icons pakai ImageMagick
          for size in 48 72 96 144 192; do
            case $size in
              48)  folder="mdpi" ;;
              72)  folder="hdpi" ;;
              96)  folder="xhdpi" ;;
              144) folder="xxhdpi" ;;
              192) folder="xxxhdpi" ;;
            esac
            convert -size ${size}x${size} \
              xc:"#1565C0" \
              -fill "#42A5F5" \
              -draw "circle $((size/2)),$((size/2)) $((size/2)),$((size/8))" \
              -fill white \
              -font DejaVu-Sans-Bold \
              -pointsize $((size/3)) \
              -gravity center \
              -annotate 0 "N" \
              app/src/main/res/mipmap-${folder}/ic_launcher.png
          done

          # 1. AndroidManifest.xml
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.INTERNAL_SYSTEM_WINDOW" />
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <application
                  android:label="NSI v4.6"
                  android:icon="@mipmap/ic_launcher">
                  <service android:name=".OverlayService" android:exported="false" android:foregroundServiceType="dataSync" />
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # 2. OverlayService.kt
          cat > app/src/main/java/com/freestyle/networkindicator/OverlayService.kt << EOF
          package com.freestyle.networkindicator
          import android.app.Service
          import android.content.Intent
          import android.graphics.Color
          import android.graphics.PixelFormat
          import android.net.TrafficStats
          import android.os.*
          import android.view.*
          import android.widget.TextView

          class OverlayService : Service() {
              private lateinit var wm: WindowManager
              private lateinit var tv: TextView
              private val handler = Handler(Looper.getMainLooper())

              companion object {
                  var isRunning = false
              }

              override fun onCreate() {
                  super.onCreate()
                  isRunning = true
                  wm = getSystemService(WINDOW_SERVICE) as WindowManager
                  tv = TextView(this).apply {
                      setTextColor(Color.WHITE)
                      setBackgroundColor(Color.parseColor("#80000000"))
                      textSize = 14f
                      setPadding(10, 5, 10, 5)
                      gravity = Gravity.END
                  }
                  val params = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.TYPE_SYSTEM_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE,
                      PixelFormat.TRANSLUCENT
                  ).apply {
                      gravity = $GRAVITY_CODE
                      x = $OFFSET_X
                      y = $OFFSET_Y
                  }
                  wm.addView(tv, params)
                  updateSpeed()
              }
              private fun updateSpeed() {
                  handler.post(object : Runnable {
                      override fun run() {
                          val rx = TrafficStats.getTotalRxBytes() / 1024
                          tv.text = "\${rx % 9999}K/s"
                          handler.postDelayed(this, 1000)
                      }
                  })
              }
              override fun onDestroy() {
                  isRunning = false
                  wm.removeView(tv)
                  super.onDestroy()
              }
              override fun onBind(i: Intent?) = null
          }
          EOF

          # 3. MainActivity.kt
          cat > app/src/main/java/com/freestyle/networkindicator/MainActivity.kt << 'EOF'
          package com.freestyle.networkindicator
          import android.app.Activity
          import android.content.Intent
          import android.graphics.Color
          import android.os.Bundle
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.TextView

          class MainActivity : Activity() {
              private lateinit var toggleBtn: Button

              override fun onCreate(b: Bundle?) {
                  super.onCreate(b)
                  grantPermissions()

                  val layout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(48, 80, 48, 48)
                  }

                  val title = TextView(this).apply {
                      text = "NSI v4.6 - Network Speed Indicator"
                      textSize = 16f
                      setTextColor(Color.BLACK)
                      setPadding(0, 0, 0, 40)
                  }

                  toggleBtn = Button(this).apply {
                      updateButtonState()
                  }
                  toggleBtn.setOnClickListener {
                      if (OverlayService.isRunning) {
                          stopService(Intent(this, OverlayService::class.java))
                      } else {
                          startService(Intent(this, OverlayService::class.java))
                      }
                      toggleBtn.postDelayed({ updateButtonState() }, 300)
                  }

                  layout.addView(title)
                  layout.addView(toggleBtn)
                  setContentView(layout)
              }

              override fun onResume() {
                  super.onResume()
                  updateButtonState()
              }

              private fun updateButtonState() {
                  if (OverlayService.isRunning) {
                      toggleBtn.text = "■  Stop Overlay"
                      toggleBtn.setBackgroundColor(Color.parseColor("#C62828"))
                      toggleBtn.setTextColor(Color.WHITE)
                  } else {
                      toggleBtn.text = "▶  Start Overlay"
                      toggleBtn.setBackgroundColor(Color.parseColor("#1565C0"))
                      toggleBtn.setTextColor(Color.WHITE)
                  }
              }

              private fun grantPermissions() {
                  try {
                      Runtime.getRuntime().exec(
                          arrayOf("su", "-c",
                              "appops set com.freestyle.networkindicator SYSTEM_ALERT_WINDOW allow && " +
                              "pm grant com.freestyle.networkindicator android.permission.INTERNAL_SYSTEM_WINDOW")
                      ).waitFor()
                  } catch (e: Exception) {
                      e.printStackTrace()
                  }
              }
          }
          EOF

          # 4. build.gradle (root)
          cat > build.gradle << 'EOF'
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.1.1'; classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.0" }
          }
          allprojects { repositories { google(); mavenCentral() } }
          EOF

          # 5. app/build.gradle
          cat > app/build.gradle << 'EOF'
          plugins { id 'com.android.application'; id 'kotlin-android' }
          android {
              namespace 'com.freestyle.networkindicator'
              compileSdk 34
              defaultConfig {
                  applicationId "com.freestyle.networkindicator"
                  minSdk 23
                  targetSdk 34
                  versionCode 9
                  versionName "4.6"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }
          dependencies { implementation "org.jetbrains.kotlin:kotlin-stdlib:1.9.0" }
          EOF

          echo "include ':app'" > settings.gradle

      - name: Build APK
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.1.1-bin.zip
          unzip -q gradle-8.1.1-bin.zip
          ./gradle-8.1.1/bin/gradle wrapper --gradle-version 8.1.1
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NSI-v4.6-Overlay
          path: app/build/outputs/apk/debug/*.apk
