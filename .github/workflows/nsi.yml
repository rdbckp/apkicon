name: Build APK - Network Indicator (Accessibility + No Launcher)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Create Project Structure & Code
        run: |
          mkdir -p app/src/main/java/com/network/speed
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/drawable

          # ====================== STRINGS ======================
          cat > app/src/main/res/values/strings.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Network Speed</string>
              <string name="overlay_permission">Overlay Permission</string>
              <string name="notification_title">📶 Network Speed Active</string>
              <string name="notification_text">Tap to open accessibility settings</string>
              <string name="accessibility_service_label">Network Speed</string>
              <string name="accessibility_service_description">Show download speed overlay in status bar area</string>
          </resources>
          EOF

          # ====================== ANDROID MANIFEST (no launcher) ======================
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools">

              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC" />

              <application
                  android:allowBackup="true"
                  android:icon="@android:drawable/ic_menu_manage"
                  android:label="@string/app_name"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar"
                  android:usesCleartextTraffic="true">

                  <service
                      android:name=".OverlayService"
                      android:exported="false"
                      android:foregroundServiceType="dataSync" />

                  <service
                      android:name=".NetworkSpeedAccessibilityService"
                      android:exported="true"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_service_config" />
                  </service>

              </application>
          </manifest>
          EOF

          # ====================== OVERLAY SERVICE (Fix: added missing import Settings) ======================
          cat > app/src/main/java/com/network/speed/OverlayService.kt << 'EOF'
          package com.network.speed

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.app.Service
          import android.content.Context
          import android.content.Intent
          import android.graphics.Color
          import android.graphics.PixelFormat
          import android.net.TrafficStats
          import android.os.Build
          import android.os.Handler
          import android.os.IBinder
          import android.os.Looper
          import android.provider.Settings
          import android.view.Gravity
          import android.view.WindowManager
          import android.widget.TextView
          import androidx.core.app.NotificationCompat
          import java.util.Locale

          class OverlayService : Service() {
              private lateinit var windowManager: WindowManager
              private lateinit var overlayView: TextView
              private val handler = Handler(Looper.getMainLooper())
              private var isActive = false
              private var lastRxBytes = 0L
              private var lastUpdateTime = 0L

              companion object {
                  var isRunning = false
                      private set
              }

              override fun onCreate() {
                  super.onCreate()
                  windowManager = getSystemService(WINDOW_SERVICE) as WindowManager
                  createOverlayView()
                  startForegroundNotification()
                  isActive = true
                  isRunning = true
                  lastRxBytes = TrafficStats.getTotalRxBytes()
                  lastUpdateTime = System.currentTimeMillis()
                  startUpdater()
              }

              private fun createOverlayView() {
                  overlayView = TextView(this).apply {
                      text = "0 KB/s"
                      setTextColor(Color.WHITE)
                      setBackgroundColor(Color.parseColor("#88000000"))
                      setPadding(6, 2, 6, 2)
                      textSize = 11f
                  }

                  val params = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O)
                          WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY
                      else
                          @Suppress("DEPRECATION")
                          WindowManager.LayoutParams.TYPE_PHONE,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                              WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE or
                              WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                      PixelFormat.TRANSLUCENT
                  ).apply {
                      gravity = Gravity.TOP or Gravity.END
                      y = 0
                      val density = resources.displayMetrics.density
                      val offsetPx = (-40 * density).toInt()
                      x = offsetPx
                  }

                  windowManager.addView(overlayView, params)
              }

              private fun startForegroundNotification() {
                  val channelId = "network_speed_channel"
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val channel = NotificationChannel(
                          channelId,
                          "Network Speed",
                          NotificationManager.IMPORTANCE_LOW
                      ).apply {
                          description = "Shows download speed overlay"
                          setShowBadge(false)
                      }
                      val notificationManager = getSystemService(NotificationManager::class.java)
                      notificationManager.createNotificationChannel(channel)
                  }

                  val intent = Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS)
                  val pendingIntent = PendingIntent.getActivity(this, 0, intent,
                      PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE)

                  val notification = NotificationCompat.Builder(this, channelId)
                      .setContentTitle(getString(R.string.notification_title))
                      .setContentText(getString(R.string.notification_text))
                      .setSmallIcon(android.R.drawable.ic_menu_manage)
                      .setContentIntent(pendingIntent)
                      .setPriority(NotificationCompat.PRIORITY_LOW)
                      .setOngoing(true)
                      .build()

                  startForeground(1, notification)
              }

              private fun startUpdater() {
                  val runnable = object : Runnable {
                      override fun run() {
                          if (!isActive) return
                          updateSpeed()
                          handler.postDelayed(this, 1000)
                      }
                  }
                  handler.post(runnable)
              }

              private fun updateSpeed() {
                  val now = System.currentTimeMillis()
                  val currentRx = TrafficStats.getTotalRxBytes()

                  if (lastRxBytes > 0 && lastUpdateTime > 0) {
                      val deltaRx = currentRx - lastRxBytes
                      val deltaTime = (now - lastUpdateTime) / 1000.0

                      if (deltaTime > 0) {
                          val downSpeed = deltaRx / deltaTime
                          val downStr = formatSpeed(downSpeed)
                          overlayView.text = "▼ $downStr"
                      }
                  }

                  lastRxBytes = currentRx
                  lastUpdateTime = now
              }

              private fun formatSpeed(bytesPerSec: Double): String {
                  return when {
                      bytesPerSec >= 1024 * 1024 -> String.format(Locale.US, "%.1f MB/s", bytesPerSec / (1024 * 1024))
                      bytesPerSec >= 1024 -> String.format(Locale.US, "%.0f KB/s", bytesPerSec / 1024)
                      else -> String.format(Locale.US, "%.0f B/s", bytesPerSec)
                  }
              }

              override fun onDestroy() {
                  super.onDestroy()
                  isActive = false
                  isRunning = false
                  handler.removeCallbacksAndMessages(null)
                  if (::overlayView.isInitialized) {
                      windowManager.removeView(overlayView)
                  }
              }

              override fun onBind(intent: Intent?): IBinder? = null
          }
          EOF

          # ====================== ACCESSIBILITY SERVICE (fix: added import Settings) ======================
          cat > app/src/main/java/com/network/speed/NetworkSpeedAccessibilityService.kt << 'EOF'
          package com.network.speed

          import android.accessibilityservice.AccessibilityService
          import android.content.Intent
          import android.os.Build
          import android.provider.Settings
          import android.view.accessibility.AccessibilityEvent

          class NetworkSpeedAccessibilityService : AccessibilityService() {

              override fun onServiceConnected() {
                  super.onServiceConnected()
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                      if (!Settings.canDrawOverlays(this)) {
                          val intent = Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                              android.net.Uri.parse("package:$packageName"))
                          intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                          startActivity(intent)
                      }
                  }
                  startOverlayService()
              }

              private fun startOverlayService() {
                  val intent = Intent(this, OverlayService::class.java)
                  startService(intent)
              }

              private fun stopOverlayService() {
                  val intent = Intent(this, OverlayService::class.java)
                  stopService(intent)
              }

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {}

              override fun onInterrupt() {
                  stopOverlayService()
              }

              override fun onDestroy() {
                  super.onDestroy()
                  stopOverlayService()
              }
          }
          EOF

          # ====================== ACCESSIBILITY CONFIG XML ======================
          cat > app/src/main/res/xml/accessibility_service_config.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeAllMask"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagDefault"
              android:canPerformGestures="false"
              android:canRetrieveWindowContent="false"
              android:description="@string/accessibility_service_description"
              android:notificationTimeout="100" />
          EOF

          # ====================== ROOT BUILD.GRADLE ======================
          cat > build.gradle << 'EOF'
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.1.1'
                  classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.0"
              }
          }
          allprojects { repositories { google(); mavenCentral() } }
          EOF

          # ====================== APP BUILD.GRADLE ======================
          cat > app/build.gradle << 'EOF'
          plugins { id 'com.android.application'; id 'kotlin-android' }
          android {
              namespace 'com.network.speed'
              compileSdk 34
              defaultConfig {
                  applicationId "com.network.speed"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = '17' }
          }
          dependencies {
              implementation "org.jetbrains.kotlin:kotlin-stdlib:1.9.0"
              implementation "androidx.core:core-ktx:1.12.0"
          }
          EOF

          echo "include ':app'" > settings.gradle
          echo "android.useAndroidX=true" > gradle.properties

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK Platform 34 & Build Tools
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Generate Gradle Wrapper
        run: |
          wget https://services.gradle.org/distributions/gradle-8.1.1-bin.zip
          unzip -q gradle-8.1.1-bin.zip
          ./gradle-8.1.1/bin/gradle wrapper --gradle-version 8.1.1
          rm -rf gradle-8.1.1-bin.zip gradle-8.1.1

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NetworkSpeed-NoIcon-Accessibility
          path: app/build/outputs/apk/debug/*.apk
