name: Build APK - Network Indicator (Termux Control)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Create Project Structure & Code (Fix for A02)
        run: |
          mkdir -p app/src/main/java/com/network/speed
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/xml

          # 1. Strings
          cat > app/src/main/res/values/strings.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">NetSpeed</string>
              <string name="notification_title">NetSpeed Active</string>
              <string name="notification_text">Run am broadcast -a com.network.speed.STOP_OVERLAY to stop</string>
          </resources>
          EOF

          # 2. AndroidManifest.xml (Tanpa Activity & Penerima Broadcast)
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools">

              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />

              <!-- Izin untuk priv-app agar aplikasi bisa nempel di system (jika perlu) -->
              <uses-permission android:name="android.permission.WRITE_SECURE_SETTINGS" tools:ignore="ProtectedPermissions"/>

              <application
                  android:allowBackup="true"
                  android:icon="@android:drawable/stat_sys_download"
                  android:label="@string/app_name"
                  android:theme="@android:style/Theme.NoDisplay"
                  android:usesCleartextTraffic="true">

                  <service
                      android:name=".OverlayService"
                      android:exported="false"
                      android:foregroundServiceType="dataSync" />

                  <!-- Receiver untuk menerima perintah dari Termux -->
                  <receiver
                      android:name=".ControlReceiver"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="com.network.speed.START_OVERLAY" />
                          <action android:name="com.network.speed.STOP_OVERLAY" />
                      </intent-filter>
                  </receiver>

              </application>
          </manifest>
          EOF

          # 3. OverlayService.kt (Menggunakan background terang agar lebih terlihat)
          cat > app/src/main/java/com/network/speed/OverlayService.kt << 'EOF'
          package com.network.speed

          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.app.Service
          import android.content.Intent
          import android.graphics.Color
          import android.graphics.PixelFormat
          import android.net.TrafficStats
          import android.os.Build
          import android.os.Handler
          import android.os.IBinder
          import android.os.Looper
          import android.provider.Settings
          import android.util.Log
          import android.view.Gravity
          import android.view.View
          import android.view.WindowManager
          import android.widget.TextView
          import androidx.core.app.NotificationCompat
          import java.util.Locale

          class OverlayService : Service() {
              private lateinit var windowManager: WindowManager
              private var overlayView: TextView? = null
              private val handler = Handler(Looper.getMainLooper())
              private var isActive = false
              private var lastRxBytes = 0L
              private var lastUpdateTime = 0L
              private val TAG = "OverlayServiceFix"

              companion object {
                  var isRunning = false
              }

              override fun onCreate() {
                  super.onCreate()
                  Log.d(TAG, "Service onCreate")

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M && !Settings.canDrawOverlays(this)) {
                      Log.e(TAG, "No overlay permission, stopping")
                      stopSelf()
                      return
                  }

                  windowManager = getSystemService(WINDOW_SERVICE) as WindowManager
                  createOverlayView()
                  startForegroundNotification()
                  isActive = true
                  isRunning = true
                  lastRxBytes = TrafficStats.getTotalRxBytes()
                  lastUpdateTime = System.currentTimeMillis()
                  startUpdater()
                  Log.d(TAG, "Service started successfully")
              }

              private fun createOverlayView() {
                  val tv = TextView(this).apply {
                      text = "▼ 0 KB/s"
                      setTextColor(Color.BLACK) // Warna hitam agar kontras di status bar putih
                      setBackgroundColor(Color.parseColor("#AAFFFFFF")) // Putih transparan
                      setPadding(8, 2, 8, 2)
                      textSize = 11f
                  }
                  overlayView = tv

                  // Menggunakan TYPE_ACCESSIBILITY_OVERLAY yang lebih mungkin berhasil di semua ROM
                  val type = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O)
                      WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY
                  else
                      WindowManager.LayoutParams.TYPE_PHONE

                  val params = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      type,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                      PixelFormat.TRANSLUCENT
                  ).apply {
                      gravity = Gravity.TOP or Gravity.END
                      x = 0
                      y = 0
                  }

                  try {
                      windowManager.addView(tv, params)
                      Log.d(TAG, "Overlay view added")
                  } catch (e: Exception) {
                      Log.e(TAG, "Failed to add overlay", e)
                  }
              }

              private fun startForegroundNotification() {
                  val channelId = "net_speed"
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val channel = NotificationChannel(channelId, "Network Speed", NotificationManager.IMPORTANCE_LOW)
                      getSystemService(NotificationManager::class.java).createNotificationChannel(channel)
                  }

                  val notification = NotificationCompat.Builder(this, channelId)
                      .setContentTitle(getString(R.string.notification_title))
                      .setContentText(getString(R.string.notification_text))
                      .setSmallIcon(android.R.drawable.stat_sys_download)
                      .setPriority(NotificationCompat.PRIORITY_LOW)
                      .setOngoing(true)
                      .build()

                  startForeground(1, notification)
              }

              private fun startUpdater() {
                  val runnable = object : Runnable {
                      override fun run() {
                          if (!isActive) return
                          updateSpeed()
                          handler.postDelayed(this, 1000)
                      }
                  }
                  handler.post(runnable)
              }

              private fun updateSpeed() {
                  val now = System.currentTimeMillis()
                  val currentRx = TrafficStats.getTotalRxBytes()

                  if (lastRxBytes > 0 && lastUpdateTime > 0) {
                      val deltaRx = currentRx - lastRxBytes
                      val deltaTime = (now - lastUpdateTime) / 1000.0
                      if (deltaTime > 0) {
                          val downSpeed = deltaRx / deltaTime
                          val speedText = when {
                              downSpeed >= 1024 * 1024 -> String.format(Locale.US, "▼ %.1f MB/s", downSpeed / (1024 * 1024))
                              downSpeed >= 1024 -> String.format(Locale.US, "▼ %.0f KB/s", downSpeed / 1024)
                              else -> String.format(Locale.US, "▼ %.0f B/s", downSpeed)
                          }
                          overlayView?.text = speedText
                      }
                  }

                  lastRxBytes = currentRx
                  lastUpdateTime = now
              }

              override fun onDestroy() {
                  super.onDestroy()
                  isActive = false
                  isRunning = false
                  handler.removeCallbacksAndMessages(null)
                  overlayView?.let { windowManager.removeView(it) }
              }

              override fun onBind(intent: Intent?): IBinder? = null
          }
          EOF

          # 4. ControlReceiver.kt (Pintu Masuk dari Termux)
          cat > app/src/main/java/com/network/speed/ControlReceiver.kt << 'EOF'
          package com.network.speed

          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.os.Build
          import android.provider.Settings
          import android.util.Log

          class ControlReceiver : BroadcastReceiver() {
              private val TAG = "ControlReceiver"

              override fun onReceive(context: Context, intent: Intent) {
                  val action = intent.action ?: return
                  Log.d(TAG, "Received action: $action")

                  if (action == "com.network.speed.START_OVERLAY") {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M && !Settings.canDrawOverlays(context)) {
                          Log.e(TAG, "Overlay permission denied. Run: appops set com.network.speed SYSTEM_ALERT_WINDOW allow")
                          return
                      }
                      context.startService(Intent(context, OverlayService::class.java))
                  } else if (action == "com.network.speed.STOP_OVERLAY") {
                      context.stopService(Intent(context, OverlayService::class.java))
                  }
              }
          }
          EOF

          # 5. build.gradle (sesuai ARM 32-bit)
          cat > build.gradle << 'EOF'
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.1.1'
                  classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.0"
              }
          }
          allprojects { repositories { google(); mavenCentral() } }
          EOF

          cat > app/build.gradle << 'EOF'
          plugins { id 'com.android.application'; id 'kotlin-android' }
          android {
              namespace 'com.network.speed'
              compileSdk 34
              defaultConfig {
                  applicationId "com.network.speed"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = '17' }
          }
          dependencies {
              implementation "org.jetbrains.kotlin:kotlin-stdlib:1.9.0"
              implementation "androidx.core:core-ktx:1.12.0"
          }
          EOF

          echo "include ':app'" > settings.gradle
          echo "android.useAndroidX=true" > gradle.properties

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Generate Gradle Wrapper
        run: |
          wget https://services.gradle.org/distributions/gradle-8.1.1-bin.zip
          unzip -q gradle-8.1.1-bin.zip
          ./gradle-8.1.1/bin/gradle wrapper --gradle-version 8.1.1
          rm -rf gradle-8.1.1-bin.zip gradle-8.1.1

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NetSpeed-Termux
          path: app/build/outputs/apk/debug/*.apk
