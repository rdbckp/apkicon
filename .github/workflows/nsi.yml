name: Build APK - NSI v4.2 - Stable Big Font

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Create Project Structure & Code
        run: |
          mkdir -p app/src/main/java/com/freestyle/networkindicator
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable

          # 1. strings.xml
          cat > app/src/main/res/values/strings.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">NSI v4.2</string>
              <string name="notif_channel">Network Speed</string>
              <string name="notif_title">Network Speed Indicator</string>
          </resources>
          EOF

          # 2. ic_placeholder.xml
          cat > app/src/main/res/drawable/ic_placeholder.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android"
              android:shape="rectangle">
              <size android:width="1dp" android:height="1dp" />
              <solid android:color="@android:color/transparent" />
          </shape>
          EOF

          # 3. AndroidManifest.xml
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />

              <application
                  android:allowBackup="true"
                  android:icon="@android:drawable/ic_menu_manage"
                  android:label="@string/app_name"
                  android:theme="@android:style/Theme.DeviceDefault.Light.DarkActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:label="@string/app_name">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".SpeedService"
                      android:exported="false"
                      android:foregroundServiceType="dataSync" />

                  <receiver
                      android:name=".BootReceiver"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED" />
                      </intent-filter>
                  </receiver>
              </application>
          </manifest>
          EOF

          # 4. MainActivity.kt
          cat > app/src/main/java/com/freestyle/networkindicator/MainActivity.kt << 'EOF'
          package com.freestyle.networkindicator

          import android.app.Activity
          import android.content.Intent
          import android.os.Build
          import android.os.Bundle
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.TextView

          class MainActivity : Activity() {
              private lateinit var statusText: TextView

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  val layout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(60, 80, 60, 60)
                  }

                  statusText = TextView(this).apply {
                      textSize = 16f
                      setPadding(0, 0, 0, 40)
                  }

                  val startBtn = Button(this).apply {
                      text = "Mulai Service"
                      setOnClickListener { startSpeedService(); updateStatus() }
                  }

                  val stopBtn = Button(this).apply {
                      text = "Hentikan Service"
                      setOnClickListener {
                          stopService(Intent(this@MainActivity, SpeedService::class.java))
                          updateStatus()
                      }
                  }

                  layout.addView(statusText)
                  layout.addView(startBtn)
                  layout.addView(stopBtn)
                  setContentView(layout)
              }

              override fun onResume() {
                  super.onResume()
                  updateStatus()
              }

              private fun startSpeedService() {
                  val intent = Intent(this, SpeedService::class.java)
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      startForegroundService(intent)
                  } else {
                      startService(intent)
                  }
              }

              private fun updateStatus() {
                  statusText.text = if (SpeedService.isRunning)
                      "Status: AKTIF ✅\n\nIndikator kecepatan besar (setara jam SB) aktif."
                  else
                      "Status: MATI ❌"
              }
          }
          EOF

          # 5. BootReceiver.kt
          cat > app/src/main/java/com/freestyle/networkindicator/BootReceiver.kt << 'EOF'
          package com.freestyle.networkindicator

          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.os.Build

          class BootReceiver : BroadcastReceiver() {
              override fun onReceive(context: Context, intent: Intent) {
                  val i = Intent(context, SpeedService::class.java)
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      context.startForegroundService(i)
                  } else {
                      context.startService(i)
                  }
              }
          }
          EOF

          # 6. SpeedService.kt - STABLE BIG FONT logic
          cat > app/src/main/java/com/freestyle/networkindicator/SpeedService.kt << 'EOF'
          package com.freestyle.networkindicator

          import android.app.*
          import android.content.Intent
          import android.graphics.*
          import android.graphics.drawable.Icon
          import android.net.TrafficStats
          import android.os.*
          import java.util.Locale

          class SpeedService : Service() {

              private val handler = Handler(Looper.getMainLooper())
              private var active = false
              private var lastRxBytes = 0L
              private var lastTime = 0L

              private val paint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  color = Color.WHITE
                  // Pakai SANS_SERIF BOLD supaya mirip font jam sistem
                  typeface = Typeface.create(Typeface.SANS_SERIF, Typeface.BOLD)
                  textAlign = Paint.Align.CENTER
              }

              companion object {
                  var isRunning = false
                      private set
                  const val NOTIF_ID = 1
                  const val CHANNEL_ID = "nsi_speed_v4"
                  const val ICON_SIZE = 96 // Resolusi tinggi untuk status bar
              }

              override fun onCreate() {
                  super.onCreate()
                  createChannel()
                  startForeground(NOTIF_ID, buildNotification(makeIcon("--")))
                  active = true
                  isRunning = true
                  lastRxBytes = TrafficStats.getTotalRxBytes()
                  lastTime = System.currentTimeMillis()
                  scheduleUpdate()
              }

              private fun scheduleUpdate() {
                  handler.postDelayed(object : Runnable {
                      override fun run() {
                          if (!active) return
                          tick()
                          handler.postDelayed(this, 1000)
                      }
                  }, 1000)
              }

              private fun tick() {
                  val now = System.currentTimeMillis()
                  val rx = TrafficStats.getTotalRxBytes()
                  val dt = (now - lastTime) / 1000.0
                  if (lastRxBytes > 0 && dt > 0) {
                      val bps = (rx - lastRxBytes) / dt
                      val nm = getSystemService(NOTIFICATION_SERVICE) as NotificationManager
                      nm.notify(NOTIF_ID, buildNotification(makeIcon(formatSpeed(bps))))
                  }
                  lastRxBytes = rx
                  lastTime = now
              }

              /**
               * STABLE BIG FONT generator.
               * Tinggi huruf dipaksa setara dengan jam sistem (sekitar 70% canvas).
               * Tidak ada auto-scaling horizontal agar tinggi tetap konsisten.
               */
              private fun makeIcon(label: String): Icon {
                  val bmp = Bitmap.createBitmap(ICON_SIZE, ICON_SIZE, Bitmap.Config.ARGB_8888)
                  val canvas = Canvas(bmp)
                  
                  // TextSize di-set fix supaya tingginya setara tinggi jam (stabil)
                  // 0.7f (70% dari 96px = ~67px) adalah standar yang pas buat font besar di SB
                  paint.textSize = ICON_SIZE * 0.72f 

                  // Hitung posisi Y supaya benar-benar Center secara visual (Baseline correction)
                  val xPos = ICON_SIZE / 2f
                  val yPos = (ICON_SIZE / 2f) - ((paint.descent() + paint.ascent()) / 2f)

                  canvas.drawText(label, xPos, yPos, paint)

                  return Icon.createWithBitmap(bmp)
              }

              private fun formatSpeed(bps: Double): String = when {
                  bps >= 1024 * 1024 -> String.format(Locale.US, "%.1fM", bps / (1024 * 1024))
                  bps >= 1024        -> String.format(Locale.US, "%.0fK", bps / 1024)
                  else               -> String.format(Locale.US, "%.0fB", bps)
              }

              private fun buildNotification(icon: Icon): Notification {
                  val pi = PendingIntent.getActivity(
                      this, 0,
                      Intent(this, MainActivity::class.java),
                      PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                  )
                  return Notification.Builder(this, CHANNEL_ID)
                      .setSmallIcon(icon)
                      .setContentTitle("Speed")
                      .setContentIntent(pi)
                      .setOngoing(true)
                      .setOnlyAlertOnce(true)
                      .setVisibility(Notification.VISIBILITY_PUBLIC)
                      .build()
              }

              private fun createChannel() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val ch = NotificationChannel(
                          CHANNEL_ID,
                          getString(R.string.notif_channel),
                          NotificationManager.IMPORTANCE_LOW
                      ).apply {
                          setShowBadge(false)
                          enableVibration(false)
                          enableLights(false)
                      }
                      (getSystemService(NOTIFICATION_SERVICE) as NotificationManager)
                          .createNotificationChannel(ch)
                  }
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int = START_STICKY
              override fun onDestroy() {
                  active = false
                  isRunning = false
                  handler.removeCallbacksAndMessages(null)
                  super.onDestroy()
              }
              override fun onBind(intent: Intent?): IBinder? = null
          }
          EOF

          # 7. build.gradle root
          cat > build.gradle << 'EOF'
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.1.1'
                  classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.0"
              }
          }
          allprojects { repositories { google(); mavenCentral() } }
          EOF

          # 8. app/build.gradle
          cat > app/build.gradle << 'EOF'
          plugins { id 'com.android.application'; id 'kotlin-android' }
          android {
              namespace 'com.freestyle.networkindicator'
              compileSdk 34
              defaultConfig {
                  applicationId "com.freestyle.networkindicator"
                  minSdk 23
                  targetSdk 34
                  versionCode 6
                  versionName "4.2"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = '17' }
          }
          dependencies {
              implementation "org.jetbrains.kotlin:kotlin-stdlib:1.9.0"
          }
          EOF

          echo "include ':app'" > settings.gradle
          echo "android.useAndroidX=true" > gradle.properties

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NSI-v4.2-StableBigFont
          path: app/build/outputs/apk/debug/*.apk
