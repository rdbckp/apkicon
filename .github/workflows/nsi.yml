name: Build APK - NSI v2 - Status Bar Indicator

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Create Project Structure & Code
        run: |
          mkdir -p app/src/main/java/com/freestyle/networkindicator
          mkdir -p app/src/main/res/values

          # 1. strings.xml
          cat > app/src/main/res/values/strings.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Network Indicator</string>
              <string name="start_service">Mulai</string>
              <string name="stop_service">Hentikan</string>
              <string name="service_running">AKTIF</string>
              <string name="service_stopped">MATI</string>
              <string name="notification_title">Network Indicator Aktif</string>
              <string name="notification_text">Download speed di status bar</string>
          </resources>
          EOF

          # 2. AndroidManifest.xml
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools">

              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.STATUS_BAR" />
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

              <application
                  android:allowBackup="true"
                  android:icon="@android:drawable/ic_menu_manage"
                  android:label="@string/app_name"
                  android:theme="@android:style/Theme.DeviceDefault.Light.DarkActionBar"
                  tools:ignore="UnusedAttribute">

                  <activity android:name=".MainActivity"
                      android:exported="true"
                      android:label="@string/app_name">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".OverlayService"
                      android:exported="false"
                      android:foregroundServiceType="dataSync" />
              </application>
          </manifest>
          EOF

          # 3. MainActivity.kt
          cat > app/src/main/java/com/freestyle/networkindicator/MainActivity.kt << 'EOF'
          package com.freestyle.networkindicator

          import android.app.Activity
          import android.content.Intent
          import android.os.Bundle
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.TextView

          class MainActivity : Activity() {
              private lateinit var statusText: TextView
              private lateinit var startButton: Button
              private lateinit var stopButton: Button

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  val layout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(60, 80, 60, 60)
                  }

                  statusText = TextView(this).apply {
                      textSize = 18f
                      setPadding(0, 0, 0, 40)
                  }

                  startButton = Button(this).apply {
                      text = getString(R.string.start_service)
                      setOnClickListener {
                          startService(Intent(this@MainActivity, OverlayService::class.java))
                          updateStatus()
                      }
                  }

                  stopButton = Button(this).apply {
                      text = getString(R.string.stop_service)
                      setOnClickListener {
                          stopService(Intent(this@MainActivity, OverlayService::class.java))
                          updateStatus()
                      }
                  }

                  layout.addView(statusText)
                  layout.addView(startButton)
                  layout.addView(stopButton)
                  setContentView(layout)
              }

              override fun onResume() {
                  super.onResume()
                  updateStatus()
              }

              private fun updateStatus() {
                  val running = OverlayService.isRunning
                  statusText.text = "Status: ${if (running) getString(R.string.service_running) + " ✅" else getString(R.string.service_stopped) + " ❌"}\n\nDownload speed tampil di status bar."
                  startButton.isEnabled = !running
                  stopButton.isEnabled = running
              }
          }
          EOF

          # 4. OverlayService.kt - TYPE_STATUS_BAR_ADDITIONAL (2009), download only
          cat > app/src/main/java/com/freestyle/networkindicator/OverlayService.kt << 'EOF'
          package com.freestyle.networkindicator

          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.app.Service
          import android.content.Intent
          import android.graphics.Color
          import android.graphics.PixelFormat
          import android.graphics.Typeface
          import android.net.TrafficStats
          import android.os.Build
          import android.os.Handler
          import android.os.IBinder
          import android.os.Looper
          import android.view.Gravity
          import android.view.WindowManager
          import android.widget.TextView
          import androidx.core.app.NotificationCompat
          import java.util.Locale

          class OverlayService : Service() {

              private lateinit var windowManager: WindowManager
              private lateinit var overlayView: TextView
              private val handler = Handler(Looper.getMainLooper())
              private var _serviceActive = false
              private var lastRxBytes = 0L
              private var lastUpdateTime = 0L

              companion object {
                  var isRunning = false
                      private set

                  // TYPE_STATUS_BAR_ADDITIONAL = 2009
                  // Nilai int internal AOSP, tidak exposed di public SDK
                  // Butuh android.permission.STATUS_BAR (privileged) untuk digunakan
                  const val TYPE_STATUS_BAR_ADDITIONAL = 2009
              }

              override fun onCreate() {
                  super.onCreate()
                  windowManager = getSystemService(WINDOW_SERVICE) as WindowManager
                  startForegroundNotification()
                  createOverlayView()
                  _serviceActive = true
                  isRunning = true
                  lastRxBytes = TrafficStats.getTotalRxBytes()
                  lastUpdateTime = System.currentTimeMillis()
                  startUpdater()
              }

              private fun createOverlayView() {
                  overlayView = TextView(this).apply {
                      text = "0K"
                      setTextColor(Color.WHITE)
                      setBackgroundColor(Color.TRANSPARENT)
                      setPadding(0, 0, 6, 0)
                      textSize = 11f
                      typeface = Typeface.create("sans-serif-condensed", Typeface.NORMAL)
                  }

                  // Pakai TYPE_STATUS_BAR_ADDITIONAL supaya masuk area status bar
                  // Fallback ke TYPE_APPLICATION_OVERLAY kalau SDK < O
                  val windowType = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      TYPE_STATUS_BAR_ADDITIONAL
                  } else {
                      @Suppress("DEPRECATION")
                      WindowManager.LayoutParams.TYPE_PHONE
                  }

                  val params = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      windowType,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                              WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE or
                              WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN or
                              WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                      PixelFormat.TRANSLUCENT
                  ).apply {
                      gravity = Gravity.END or Gravity.TOP
                      // x = offset dari kanan layar (pixel)
                      // Area kanan status bar Samsung A02: signal+wifi+battery+clock ~280px
                      // Teks kita nempel di kiri icon wifi, jadi offset ~180px dari kanan
                      // Kalau kurang pas, tinggal adjust nilai ini via rebuild
                      x = 180
                      y = 0
                  }

                  windowManager.addView(overlayView, params)
              }

              private fun startForegroundNotification() {
                  val channelId = "nsi_channel"
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val channel = NotificationChannel(
                          channelId, "Network Indicator", NotificationManager.IMPORTANCE_LOW
                      )
                      getSystemService(NotificationManager::class.java).createNotificationChannel(channel)
                  }

                  val pi = PendingIntent.getActivity(
                      this, 0, Intent(this, MainActivity::class.java),
                      PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                  )

                  val notif = NotificationCompat.Builder(this, channelId)
                      .setContentTitle(getString(R.string.notification_title))
                      .setContentText(getString(R.string.notification_text))
                      .setSmallIcon(android.R.drawable.ic_menu_manage)
                      .setContentIntent(pi)
                      .setPriority(NotificationCompat.PRIORITY_LOW)
                      .build()

                  startForeground(1, notif)
              }

              private fun startUpdater() {
                  val runnable = object : Runnable {
                      override fun run() {
                          if (!_serviceActive) return
                          updateSpeed()
                          handler.postDelayed(this, 1000)
                      }
                  }
                  handler.post(runnable)
              }

              private fun updateSpeed() {
                  val now = System.currentTimeMillis()
                  val currentRx = TrafficStats.getTotalRxBytes()
                  val deltaTime = (now - lastUpdateTime) / 1000.0

                  if (lastRxBytes > 0 && deltaTime > 0) {
                      val downSpeed = (currentRx - lastRxBytes) / deltaTime
                      overlayView.text = formatSpeed(downSpeed)
                  }

                  lastRxBytes = currentRx
                  lastUpdateTime = now
              }

              // Format singkat biar muat di status bar: "123K", "1.2M", "45B"
              private fun formatSpeed(bps: Double): String = when {
                  bps >= 1024 * 1024 -> String.format(Locale.US, "%.1fM", bps / (1024 * 1024))
                  bps >= 1024        -> String.format(Locale.US, "%.0fK", bps / 1024)
                  else               -> String.format(Locale.US, "%.0fB", bps)
              }

              override fun onDestroy() {
                  super.onDestroy()
                  _serviceActive = false
                  isRunning = false
                  handler.removeCallbacksAndMessages(null)
                  if (::overlayView.isInitialized) {
                      try { windowManager.removeView(overlayView) } catch (_: Exception) {}
                  }
              }

              override fun onBind(intent: Intent?): IBinder? = null
          }
          EOF

          # 5. build.gradle (root)
          cat > build.gradle << 'EOF'
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.1.1'
                  classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.0"
              }
          }
          allprojects { repositories { google(); mavenCentral() } }
          EOF

          # 6. app/build.gradle
          cat > app/build.gradle << 'EOF'
          plugins { id 'com.android.application'; id 'kotlin-android' }
          android {
              namespace 'com.freestyle.networkindicator'
              compileSdk 34
              defaultConfig {
                  applicationId "com.freestyle.networkindicator"
                  minSdk 21
                  targetSdk 34
                  versionCode 2
                  versionName "2.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = '17' }
          }
          dependencies {
              implementation "org.jetbrains.kotlin:kotlin-stdlib:1.9.0"
              implementation "androidx.core:core-ktx:1.12.0"
          }
          EOF

          echo "include ':app'" > settings.gradle
          echo "android.useAndroidX=true" > gradle.properties

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK Platform 34 & Build Tools
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Generate Gradle Wrapper (Gradle 8.1.1)
        run: |
          wget https://services.gradle.org/distributions/gradle-8.1.1-bin.zip
          unzip -q gradle-8.1.1-bin.zip
          ./gradle-8.1.1/bin/gradle wrapper --gradle-version 8.1.1
          rm -rf gradle-8.1.1-bin.zip gradle-8.1.1

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NetworkIndicator-v2-debug
          path: app/build/outputs/apk/debug/*.apk
