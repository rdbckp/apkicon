name: Build APK - NSI v4.6 - Overlay Service (Right Top)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Create Project Structure
        run: |
          mkdir -p app/src/main/java/com/freestyle/networkindicator
          mkdir -p app/src/main/res/values

          # 1. AndroidManifest.xml
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <application android:label="NSI v4.6">
                  <service android:name=".OverlayService" android:exported="false" android:foregroundServiceType="dataSync" />
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # 2. OverlayService.kt
          cat > app/src/main/java/com/freestyle/networkindicator/OverlayService.kt << 'EOF'
          package com.freestyle.networkindicator
          import android.app.Service
          import android.content.Intent
          import android.graphics.Color
          import android.graphics.PixelFormat
          import android.net.TrafficStats
          import android.os.*
          import android.view.*
          import android.widget.TextView

          class OverlayService : Service() {
              private lateinit var wm: WindowManager
              private lateinit var tv: TextView
              private val handler = Handler(Looper.getMainLooper())

              override fun onCreate() {
                  super.onCreate()
                  wm = getSystemService(WINDOW_SERVICE) as WindowManager
                  tv = TextView(this).apply {
                      setTextColor(Color.WHITE)
                      setBackgroundColor(Color.parseColor("#80000000"))
                      textSize = 14f
                      setPadding(10, 5, 10, 5)
                  }
                  val params = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE,
                      PixelFormat.TRANSLUCENT
                  ).apply {
                      gravity = Gravity.TOP or Gravity.END
                      y = 100
                  }
                  wm.addView(tv, params)
                  updateSpeed()
              }
              private fun updateSpeed() {
                  handler.post(object : Runnable {
                      override fun run() {
                          val rx = TrafficStats.getTotalRxBytes() / 1024
                          tv.text = "${rx % 9999}K/s"
                          handler.postDelayed(this, 1000)
                      }
                  })
              }
              override fun onDestroy() { wm.removeView(tv); super.onDestroy() }
              override fun onBind(i: Intent?) = null
          }
          EOF

          # 3. MainActivity.kt
          cat > app/src/main/java/com/freestyle/networkindicator/MainActivity.kt << 'EOF'
          package com.freestyle.networkindicator
          import android.app.Activity
          import android.content.Intent
          import android.os.Bundle
          import android.widget.Button
          class MainActivity : Activity() {
              override fun onCreate(b: Bundle?) {
                  super.onCreate(b)
                  val btn = Button(this).apply { text = "Start Overlay" }
                  btn.setOnClickListener { startService(Intent(this, OverlayService::class.java)) }
                  setContentView(btn)
              }
          }
          EOF

          # 4. build.gradle
          cat > build.gradle << 'EOF'
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.1.1'; classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.0" }
          }
          allprojects { repositories { google(); mavenCentral() } }
          EOF
          cat > app/build.gradle << 'EOF'
          plugins { id 'com.android.application'; id 'kotlin-android' }
          android { namespace 'com.freestyle.networkindicator'; compileSdk 34; defaultConfig { applicationId "com.freestyle.networkindicator"; minSdk 23; targetSdk 34; versionCode 8; versionName "4.6" } }
          dependencies { implementation "org.jetbrains.kotlin:kotlin-stdlib:1.9.0" }
          EOF
          echo "include ':app'" > settings.gradle

      - name: Build APK
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.1.1-bin.zip
          unzip -q gradle-8.1.1-bin.zip
          ./gradle-8.1.1/bin/gradle wrapper --gradle-version 8.1.1
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NSI-v4.6-Overlay
          path: app/build/outputs/apk/debug/*.apk
