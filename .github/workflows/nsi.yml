name: Build APK - NSI v3 - Status Bar Area (Precise)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Create Project Structure & Code
        run: |
          mkdir -p app/src/main/java/com/freestyle/networkindicator
          mkdir -p app/src/main/res/values

          # 1. strings.xml
          cat > app/src/main/res/values/strings.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Network Indicator</string>
              <string name="start_service">Mulai</string>
              <string name="stop_service">Hentikan</string>
              <string name="notification_title">Network Indicator</string>
              <string name="notification_text">Download speed aktif</string>
          </resources>
          EOF

          # 2. AndroidManifest.xml
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools">

              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />

              <application
                  android:allowBackup="true"
                  android:icon="@android:drawable/ic_menu_manage"
                  android:label="@string/app_name"
                  android:theme="@android:style/Theme.DeviceDefault.Light.DarkActionBar"
                  tools:ignore="UnusedAttribute">

                  <activity android:name=".MainActivity"
                      android:exported="true"
                      android:label="@string/app_name">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".OverlayService"
                      android:exported="false"
                      android:foregroundServiceType="dataSync" />

                  <!-- Auto-start on boot -->
                  <receiver
                      android:name=".BootReceiver"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED" />
                          <action android:name="android.intent.action.LOCKED_BOOT_COMPLETED" />
                      </intent-filter>
                  </receiver>
              </application>
          </manifest>
          EOF

          # 3. MainActivity.kt
          cat > app/src/main/java/com/freestyle/networkindicator/MainActivity.kt << 'EOF'
          package com.freestyle.networkindicator

          import android.app.Activity
          import android.content.Intent
          import android.os.Build
          import android.os.Bundle
          import android.provider.Settings
          import android.net.Uri
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.TextView
          import android.widget.Toast

          class MainActivity : Activity() {
              private lateinit var statusText: TextView
              private lateinit var startButton: Button
              private lateinit var stopButton: Button

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  val layout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(60, 80, 60, 60)
                  }

                  statusText = TextView(this).apply {
                      textSize = 16f
                      setPadding(0, 0, 0, 40)
                  }

                  val permButton = Button(this).apply {
                      text = "Izin Overlay"
                      setOnClickListener {
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                              startActivity(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                                  Uri.parse("package:$packageName")))
                          }
                      }
                  }

                  startButton = Button(this).apply {
                      text = getString(R.string.start_service)
                      setOnClickListener {
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M && !Settings.canDrawOverlays(this@MainActivity)) {
                              Toast.makeText(this@MainActivity, "Kasih izin overlay dulu!", Toast.LENGTH_SHORT).show()
                              return@setOnClickListener
                          }
                          startService(Intent(this@MainActivity, OverlayService::class.java))
                          updateStatus()
                      }
                  }

                  stopButton = Button(this).apply {
                      text = getString(R.string.stop_service)
                      setOnClickListener {
                          stopService(Intent(this@MainActivity, OverlayService::class.java))
                          updateStatus()
                      }
                  }

                  layout.addView(statusText)
                  layout.addView(permButton)
                  layout.addView(startButton)
                  layout.addView(stopButton)
                  setContentView(layout)
              }

              override fun onResume() {
                  super.onResume()
                  updateStatus()
              }

              private fun updateStatus() {
                  val running = OverlayService.isRunning
                  val hasPerm = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M)
                      Settings.canDrawOverlays(this) else true
                  statusText.text = "Status: ${if (running) "AKTIF ✅" else "MATI ❌"}\n" +
                      "Overlay izin: ${if (hasPerm) "✅" else "❌ (tap Izin Overlay)"}\n\n" +
                      "App auto-start saat boot."
                  startButton.isEnabled = !running
                  stopButton.isEnabled = running
              }
          }
          EOF

          # 4. BootReceiver.kt
          cat > app/src/main/java/com/freestyle/networkindicator/BootReceiver.kt << 'EOF'
          package com.freestyle.networkindicator

          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.os.Build

          class BootReceiver : BroadcastReceiver() {
              override fun onReceive(context: Context, intent: Intent) {
                  if (intent.action == Intent.ACTION_BOOT_COMPLETED ||
                      intent.action == "android.intent.action.LOCKED_BOOT_COMPLETED") {
                      val serviceIntent = Intent(context, OverlayService::class.java)
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          context.startForegroundService(serviceIntent)
                      } else {
                          context.startService(serviceIntent)
                      }
                  }
              }
          }
          EOF

          # 5. OverlayService.kt
          # Data presisi dari A02:
          #   StatusBar height = 45px (dari dumpsys window)
          #   Density = 300dpi → 1dp = 1.875px
          #   Layar = 720x1600px
          #   Strategi: y = -45 + FLAG_LAYOUT_NO_LIMITS → masuk area SB
          #   x = 150px dari kanan → kiri dari area clock/battery Samsung
          cat > app/src/main/java/com/freestyle/networkindicator/OverlayService.kt << 'EOF'
          package com.freestyle.networkindicator

          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.app.Service
          import android.content.Intent
          import android.graphics.Color
          import android.graphics.PixelFormat
          import android.graphics.Typeface
          import android.net.TrafficStats
          import android.os.Build
          import android.os.Handler
          import android.os.IBinder
          import android.os.Looper
          import android.view.Gravity
          import android.view.WindowManager
          import android.widget.TextView
          import androidx.core.app.NotificationCompat
          import java.util.Locale

          class OverlayService : Service() {

              private lateinit var windowManager: WindowManager
              private lateinit var overlayView: TextView
              private val handler = Handler(Looper.getMainLooper())
              private var _serviceActive = false
              private var lastRxBytes = 0L
              private var lastUpdateTime = 0L

              companion object {
                  var isRunning = false
                      private set

                  // A02 data: SB height = 45px, density = 300dpi
                  const val SB_HEIGHT_PX = 45
                  // Offset dari kanan: area clock+battery+wifi Samsung A02
                  // Clock Samsung ~72px, battery ~30px, wifi+signal ~48px = ~150px total
                  // Tambah sedikit padding → 160px
                  const val OFFSET_FROM_RIGHT_PX = 160
              }

              override fun onCreate() {
                  super.onCreate()
                  windowManager = getSystemService(WINDOW_SERVICE) as WindowManager
                  startForegroundNotification()
                  createOverlayView()
                  _serviceActive = true
                  isRunning = true
                  lastRxBytes = TrafficStats.getTotalRxBytes()
                  lastUpdateTime = System.currentTimeMillis()
                  startUpdater()
              }

              private fun createOverlayView() {
                  overlayView = TextView(this).apply {
                      text = "0K"
                      setTextColor(Color.WHITE)
                      setBackgroundColor(Color.TRANSPARENT)
                      setPadding(0, 0, 4, 0)
                      // 11sp → 11 * (300/160) = ~20.6px — setara font angka baterai Samsung
                      textSize = 11f
                      typeface = Typeface.create("sans-serif-condensed", Typeface.NORMAL)
                  }

                  val params = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      SB_HEIGHT_PX,  // tinggi pas setinggi SB
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O)
                          WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY
                      else
                          @Suppress("DEPRECATION")
                          WindowManager.LayoutParams.TYPE_PHONE,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                              WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE or
                              WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS or
                              WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN,
                      PixelFormat.TRANSLUCENT
                  ).apply {
                      gravity = Gravity.END or Gravity.TOP
                      x = OFFSET_FROM_RIGHT_PX
                      // y = -SB_HEIGHT_PX → masuk area SB karena FLAG_LAYOUT_NO_LIMITS
                      y = -SB_HEIGHT_PX
                  }

                  windowManager.addView(overlayView, params)
              }

              private fun startForegroundNotification() {
                  val channelId = "nsi_channel"
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val channel = NotificationChannel(
                          channelId, "Network Indicator", NotificationManager.IMPORTANCE_LOW
                      )
                      getSystemService(NotificationManager::class.java).createNotificationChannel(channel)
                  }
                  val pi = PendingIntent.getActivity(
                      this, 0, Intent(this, MainActivity::class.java),
                      PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                  )
                  startForeground(1, NotificationCompat.Builder(this, channelId)
                      .setContentTitle(getString(R.string.notification_title))
                      .setContentText(getString(R.string.notification_text))
                      .setSmallIcon(android.R.drawable.ic_menu_manage)
                      .setContentIntent(pi)
                      .setPriority(NotificationCompat.PRIORITY_LOW)
                      .build())
              }

              private fun startUpdater() {
                  val runnable = object : Runnable {
                      override fun run() {
                          if (!_serviceActive) return
                          updateSpeed()
                          handler.postDelayed(this, 1000)
                      }
                  }
                  handler.post(runnable)
              }

              private fun updateSpeed() {
                  val now = System.currentTimeMillis()
                  val currentRx = TrafficStats.getTotalRxBytes()
                  val deltaTime = (now - lastUpdateTime) / 1000.0
                  if (lastRxBytes > 0 && deltaTime > 0) {
                      val bps = (currentRx - lastRxBytes) / deltaTime
                      overlayView.text = formatSpeed(bps)
                  }
                  lastRxBytes = currentRx
                  lastUpdateTime = now
              }

              // Format singkat biar muat: "123K", "1.2M", "45B"
              private fun formatSpeed(bps: Double): String = when {
                  bps >= 1024 * 1024 -> String.format(Locale.US, "%.1fM", bps / (1024 * 1024))
                  bps >= 1024        -> String.format(Locale.US, "%.0fK", bps / 1024)
                  else               -> String.format(Locale.US, "%.0fB", bps)
              }

              override fun onDestroy() {
                  super.onDestroy()
                  _serviceActive = false
                  isRunning = false
                  handler.removeCallbacksAndMessages(null)
                  if (::overlayView.isInitialized) {
                      try { windowManager.removeView(overlayView) } catch (_: Exception) {}
                  }
              }

              override fun onBind(intent: Intent?): IBinder? = null
          }
          EOF

          # 6. build.gradle (root)
          cat > build.gradle << 'EOF'
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.1.1'
                  classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.0"
              }
          }
          allprojects { repositories { google(); mavenCentral() } }
          EOF

          # 7. app/build.gradle
          cat > app/build.gradle << 'EOF'
          plugins { id 'com.android.application'; id 'kotlin-android' }
          android {
              namespace 'com.freestyle.networkindicator'
              compileSdk 34
              defaultConfig {
                  applicationId "com.freestyle.networkindicator"
                  minSdk 21
                  targetSdk 34
                  versionCode 3
                  versionName "3.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = '17' }
          }
          dependencies {
              implementation "org.jetbrains.kotlin:kotlin-stdlib:1.9.0"
              implementation "androidx.core:core-ktx:1.12.0"
          }
          EOF

          echo "include ':app'" > settings.gradle
          echo "android.useAndroidX=true" > gradle.properties

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK Platform 34 & Build Tools
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Generate Gradle Wrapper (Gradle 8.1.1)
        run: |
          wget https://services.gradle.org/distributions/gradle-8.1.1-bin.zip
          unzip -q gradle-8.1.1-bin.zip
          ./gradle-8.1.1/bin/gradle wrapper --gradle-version 8.1.1
          rm -rf gradle-8.1.1-bin.zip gradle-8.1.1

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NetworkIndicator-v3-debug
          path: app/build/outputs/apk/debug/*.apk
