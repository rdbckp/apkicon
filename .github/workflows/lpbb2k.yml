name: Build APK - Fix Missing Wrapper

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Create Android project
        run: |
          mkdir -p app/src/main/java/com/freestyle/longpresskill
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/values
          mkdir -p gradle/wrapper
          
          # Strings resource
          cat > app/src/main/res/values/strings.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Long Press Kill</string>
              <string name="accessibility_desc">Tekan lama tombol BACK (0.6 detik) untuk force kill aplikasi (Root).</string>
          </resources>
          EOF
          
          # Manifest
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.freestyle.longpresskill">
              <uses-permission android:name="android.permission.KILL_BACKGROUND_PROCESSES" />
              <application
                  android:allowBackup="true"
                  android:icon="@android:drawable/ic_menu_close_clear_cancel"
                  android:label="@string/app_name"
                  android:theme="@android:style/Theme.DeviceDefault.Light.DarkActionBar">
                  <activity android:name=".MainActivity"
                      android:exported="true"
                      android:label="@string/app_name">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".LongPressKillService"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_service_config" />
                  </service>
              </application>
          </manifest>
          EOF
          
          # MainActivity
          cat > app/src/main/java/com/freestyle/longpresskill/MainActivity.kt << 'EOF'
          package com.freestyle.longpresskill
          import android.os.Bundle
          import android.provider.Settings
          import android.content.Intent
          import android.widget.Button
          import android.widget.TextView
          import android.widget.LinearLayout
          import android.app.Activity
          
          class MainActivity : Activity() {
              private lateinit var statusText: TextView
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val layout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(50, 50, 50, 50)
                  }
                  statusText = TextView(this).apply {
                      text = "Service Status: Checking..."
                      textSize = 18f
                      setPadding(0, 0, 0, 50)
                  }
                  val enableButton = Button(this).apply {
                      text = "Buka Setting Accessibility"
                      setOnClickListener {
                          startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                      }
                  }
                  layout.addView(statusText)
                  layout.addView(enableButton)
                  setContentView(layout)
              }
              override fun onResume() {
                  super.onResume()
                  val isEnabled = isAccessibilityServiceEnabled()
                  statusText.text = "Service Status: ${if (isEnabled) "AKTIF ✅" else "MATI ❌"}\n\nTekan lama BACK (0.6s) untuk kill app."
              }
              private fun isAccessibilityServiceEnabled(): Boolean {
                  val service = "${packageName}/${LongPressKillService::class.java.name}"
                  val enabledServices = Settings.Secure.getString(contentResolver, Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES)
                  return enabledServices?.contains(service) == true
              }
          }
          EOF
          
          # Service Logic
          cat > app/src/main/java/com/freestyle/longpresskill/LongPressKillService.kt << 'EOF'
          package com.freestyle.longpresskill
          import android.accessibilityservice.AccessibilityService
          import android.app.ActivityManager
          import android.content.Context
          import android.os.Handler
          import android.os.Looper
          import android.view.KeyEvent
          
          class LongPressKillService : AccessibilityService() {
              private var backPressStartTime = 0L
              private val handler = Handler(Looper.getMainLooper())
              private val DELAY = 600L
              
              override fun onKeyEvent(event: KeyEvent?): Boolean {
                  if (event?.keyCode == KeyEvent.KEYCODE_BACK) {
                      when (event.action) {
                          KeyEvent.ACTION_DOWN -> {
                              if (backPressStartTime == 0L) {
                                  backPressStartTime = System.currentTimeMillis()
                                  handler.postDelayed({
                                      if (backPressStartTime != 0L) killForegroundApp()
                                  }, DELAY)
                              }
                          }
                          KeyEvent.ACTION_UP -> {
                              backPressStartTime = 0L
                              handler.removeCallbacksAndMessages(null)
                          }
                      }
                  }
                  return false
              }
              
              private fun killForegroundApp() {
                  val am = getSystemService(Context.ACTIVITY_SERVICE) as ActivityManager
                  val currentApp = am.runningAppProcesses?.firstOrNull { 
                      it.importance == ActivityManager.RunningAppProcessInfo.IMPORTANCE_FOREGROUND 
                  }
                  currentApp?.let {
                      if (it.processName != packageName) {
                          Runtime.getRuntime().exec(arrayOf("su", "-c", "am force-stop ${it.processName}"))
                      }
                  }
              }
              override fun onInterrupt() {}
          }
          EOF
          
          # XML Config
          cat > app/src/main/res/xml/accessibility_service_config.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeAllMask"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagReportViewIds|flagRequestFilterKeyEvents"
              android:canRequestFilterKeyEvents="true"
              android:description="@string/accessibility_desc"
              android:notificationTimeout="100" />
          EOF

          # Build files
          cat > app/build.gradle << 'EOF'
          plugins { id 'com.android.application'; id 'kotlin-android' }
          android {
              namespace 'com.freestyle.longpresskill'
              compileSdk 34
              defaultConfig {
                  applicationId "com.freestyle.longpresskill"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
          }
          dependencies { implementation "org.jetbrains.kotlin:kotlin-stdlib:1.9.0" }
          EOF

          cat > build.gradle << 'EOF'
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.1.1'
                  classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.0"
              }
          }
          allprojects { repositories { google(); mavenCentral() } }
          EOF
          
          cat > settings.gradle << 'EOF'
          rootProject.name = "LongPressKill"
          include ':app'
          EOF
          
          cat > gradle.properties << 'EOF'
          android.useAndroidX=true
          EOF

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle Wrapper (Fix ClassNotFound)
        run: |
          # Download gradlew dan jar-nya secara manual ke folder yang bener
          wget -q https://raw.githubusercontent.com/gradle/gradle/v8.1.0/gradlew -O gradlew
          mkdir -p gradle/wrapper
          wget -q https://raw.githubusercontent.com/gradle/gradle/v8.1.0/gradle/wrapper/gradle-wrapper.jar -O gradle/wrapper/gradle-wrapper.jar
          chmod +x gradlew

      - name: Build APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LongPressKill-Fixed
          path: app/build/outputs/apk/debug/*.apk
