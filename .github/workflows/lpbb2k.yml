name: Build APK - Fix Broken Pipe

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Create Android project
        run: |
          mkdir -p app/src/main/java/com/freestyle/longpresskill
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/values
          mkdir -p gradle/wrapper
          
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.freestyle.longpresskill">
              <uses-permission android:name="android.permission.KILL_BACKGROUND_PROCESSES" />
              <application
                  android:allowBackup="true"
                  android:icon="@android:drawable/ic_menu_close_clear_cancel"
                  android:label="Long Press Kill"
                  android:theme="@android:style/Theme.DeviceDefault.Light.DarkActionBar">
                  <activity android:name=".MainActivity"
                      android:exported="true"
                      android:label="Long Press Kill">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".LongPressKillService"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_service_config" />
                  </service>
              </application>
          </manifest>
          EOF
          
          cat > app/src/main/java/com/freestyle/longpresskill/MainActivity.kt << 'EOF'
          package com.freestyle.longpresskill
          import android.os.Bundle
          import android.provider.Settings
          import android.content.Intent
          import android.widget.Button
          import android.widget.TextView
          import android.widget.LinearLayout
          import androidx.appcompat.app.AppCompatActivity
          
          class MainActivity : AppCompatActivity() {
              private lateinit var statusText: TextView
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val layout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(50, 50, 50, 50)
                  }
                  statusText = TextView(this).apply {
                      text = "Long Press Kill Service\nStatus: Checking..."
                      textSize = 18f
                      setPadding(0, 0, 0, 50)
                  }
                  val enableButton = Button(this).apply {
                      text = "Enable Accessibility Service"
                      setOnClickListener {
                          startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                      }
                  }
                  layout.addView(statusText)
                  layout.addView(enableButton)
                  setContentView(layout)
              }
              override fun onResume() {
                  super.onResume()
                  val isEnabled = isAccessibilityServiceEnabled()
                  statusText.text = "Long Press Kill Service\nStatus: ${if (isEnabled) "ACTIVE ✅" else "INACTIVE ❌"}\n\nLong press BACK button for 0.6 seconds to kill app"
              }
              private fun isAccessibilityServiceEnabled(): Boolean {
                  val service = "${packageName}/${LongPressKillService::class.java.name}"
                  return try {
                      val enabledServices = Settings.Secure.getString(contentResolver, Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES)
                      enabledServices?.contains(service) == true
                  } catch(e: Exception) { false }
              }
          }
          EOF
          
          cat > app/src/main/java/com/freestyle/longpresskill/LongPressKillService.kt << 'EOF'
          package com.freestyle.longpresskill
          import android.accessibilityservice.AccessibilityService
          import android.app.ActivityManager
          import android.content.Context
          import android.os.Build
          import android.os.Handler
          import android.os.Looper
          import android.view.KeyEvent
          
          class LongPressKillService : AccessibilityService() {
              private var backPressStartTime = 0L
              private val handler = Handler(Looper.getMainLooper())
              private val LONG_PRESS_DELAY_MS = 600L
              override fun onServiceConnected() { super.onServiceConnected() }
              override fun onKeyEvent(event: KeyEvent?): Boolean {
                  if (event?.keyCode == KeyEvent.KEYCODE_BACK) {
                      when (event.action) {
                          KeyEvent.ACTION_DOWN -> {
                              backPressStartTime = System.currentTimeMillis()
                              handler.postDelayed({
                                  val duration = System.currentTimeMillis() - backPressStartTime
                                  if (duration >= LONG_PRESS_DELAY_MS - 50) killForegroundApp()
                              }, LONG_PRESS_DELAY_MS)
                          }
                          KeyEvent.ACTION_UP -> handler.removeCallbacksAndMessages(null)
                      }
                  }
                  return false
              }
              private fun killForegroundApp() {
                  try {
                      val am = getSystemService(Context.ACTIVITY_SERVICE) as ActivityManager
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                          val currentApp = am.runningAppProcesses?.firstOrNull { 
                              it.importance == ActivityManager.RunningAppProcessInfo.IMPORTANCE_FOREGROUND 
                          }
                          currentApp?.let {
                              Runtime.getRuntime().exec(arrayOf("su", "-c", "am force-stop ${it.processName}"))
                          }
                      }
                  } catch(e: Exception) { }
              }
              override fun onInterrupt() {}
          }
          EOF
          
          cat > app/src/main/res/xml/accessibility_service_config.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeAllMask"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagReportViewIds"
              android:canPerformGestures="true"
              android:canRetrieveWindowContent="true"
              android:description="Long press BACK button to force kill current app"
              android:notificationTimeout="100" />
          EOF
          
          cat > app/src/main/res/values/strings.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Long Press Kill</string>
          </resources>
          EOF
          
          cat > app/build.gradle << 'EOF'
          plugins {
              id 'com.android.application'
              id 'kotlin-android'
          }
          
          android {
              namespace 'com.freestyle.longpresskill'
              compileSdk 33
              
              defaultConfig {
                  applicationId "com.freestyle.longpresskill"
                  minSdk 29
                  targetSdk 33
                  versionCode 1
                  versionName "1.0"
              }
              
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_11
                  targetCompatibility JavaVersion.VERSION_11
              }
              
              kotlinOptions {
                  jvmTarget = '11'
              }
          }
          
          dependencies {
              implementation 'androidx.core:core-ktx:1.9.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          EOF
          
          cat > build.gradle << 'EOF'
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:7.4.2'
                  classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.8.0"
              }
          }
          
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          
          tasks.register('clean', Delete) {
              delete rootProject.buildDir
          }
          EOF
          
          cat > settings.gradle << 'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "LongPressKill"
          include ':app'
          EOF
          
          cat > gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=true
          EOF
          
          cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-7.5-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF
          
          echo "✅ Project created"

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'temurin'

      - name: Install Android SDK
        run: |
          export ANDROID_HOME=$HOME/android-sdk
          mkdir -p $ANDROID_HOME/cmdline-tools

          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-11076708_latest.zip
          mv cmdline-tools $ANDROID_HOME/cmdline-tools/latest

          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH

          mkdir -p $ANDROID_HOME/licenses
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > $ANDROID_HOME/licenses/android-sdk-license
          echo "84831b9409646a918e30573bab4c9c91346d8abd" > $ANDROID_HOME/licenses/android-sdk-preview-license

          sdkmanager "platforms;android-33" "build-tools;33.0.2"

          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH

      - name: Download Gradle Wrapper
        run: |
          wget -q https://raw.githubusercontent.com/gradle/gradle/v7.5.0/gradle/wrapper/gradle-wrapper.jar -O gradle/wrapper/gradle-wrapper.jar
          cat > gradlew << 'EOF'
          #!/bin/bash
          exec gradle "$@"
          EOF
          chmod +x gradlew

      - name: Build APK
        run: |
          export ANDROID_HOME=$HOME/android-sdk
          export JAVA_HOME=$JAVA_HOME_17_X64
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LongPressKill-Final
          path: app/build/outputs/apk/debug/*.apk
