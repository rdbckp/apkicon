name: Build APK Hard Mode

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: 17
        distribution: 'temurin'
        
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      
    - name: Create full Android project
      run: |
        # Hapus yang lama kalo ada
        rm -rf LongPressKillApp
        mkdir -p LongPressKillApp/app/src/main/java/com/freestyle/longpresskill
        mkdir -p LongPressKillApp/app/src/main/res/xml
        mkdir -p LongPressKillApp/app/src/main/res/values
        mkdir -p LongPressKillApp/gradle/wrapper
        cd LongPressKillApp
        
        # AndroidManifest.xml
        cat > app/src/main/AndroidManifest.xml << 'EOF'
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android"
            package="com.freestyle.longpresskill">
            <uses-permission android:name="android.permission.KILL_BACKGROUND_PROCESSES" />
            <application
                android:allowBackup="true"
                android:icon="@android:drawable/ic_menu_close_clear_cancel"
                android:label="Long Press Kill"
                android:theme="@android:style/Theme.DeviceDefault.Light.DarkActionBar">
                <activity android:name=".MainActivity"
                    android:exported="true"
                    android:label="Long Press Kill">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
                <service
                    android:name=".LongPressKillService"
                    android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.accessibilityservice.AccessibilityService" />
                    </intent-filter>
                    <meta-data
                        android:name="android.accessibilityservice"
                        android:resource="@xml/accessibility_service_config" />
                </service>
            </application>
        </manifest>
        EOF
        
        # MainActivity.kt
        cat > app/src/main/java/com/freestyle/longpresskill/MainActivity.kt << 'EOF'
        package com.freestyle.longpresskill
        import android.os.Bundle
        import android.provider.Settings
        import android.content.Intent
        import android.widget.Button
        import android.widget.TextView
        import android.widget.LinearLayout
        import androidx.appcompat.app.AppCompatActivity
        
        class MainActivity : AppCompatActivity() {
            private lateinit var statusText: TextView
            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                val layout = LinearLayout(this).apply {
                    orientation = LinearLayout.VERTICAL
                    setPadding(50, 50, 50, 50)
                }
                statusText = TextView(this).apply {
                    text = "Long Press Kill Service\nStatus: Checking..."
                    textSize = 18f
                    setPadding(0, 0, 0, 50)
                }
                val enableButton = Button(this).apply {
                    text = "Enable Accessibility Service"
                    setOnClickListener {
                        startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                    }
                }
                layout.addView(statusText)
                layout.addView(enableButton)
                setContentView(layout)
            }
            override fun onResume() {
                super.onResume()
                val isEnabled = isAccessibilityServiceEnabled()
                statusText.text = "Long Press Kill Service\nStatus: ${if (isEnabled) "ACTIVE ✅" else "INACTIVE ❌"}\n\nLong press BACK button for 0.6 seconds to kill app"
            }
            private fun isAccessibilityServiceEnabled(): Boolean {
                val service = "${packageName}/${LongPressKillService::class.java.name}"
                return try {
                    val enabledServices = Settings.Secure.getString(contentResolver, Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES)
                    enabledServices?.contains(service) == true
                } catch(e: Exception) { false }
            }
        }
        EOF
        
        # LongPressKillService.kt
        cat > app/src/main/java/com/freestyle/longpresskill/LongPressKillService.kt << 'EOF'
        package com.freestyle.longpresskill
        import android.accessibilityservice.AccessibilityService
        import android.app.ActivityManager
        import android.content.Context
        import android.os.Build
        import android.os.Handler
        import android.os.Looper
        import android.view.KeyEvent
        
        class LongPressKillService : AccessibilityService() {
            private var backPressStartTime = 0L
            private val handler = Handler(Looper.getMainLooper())
            private val LONG_PRESS_DELAY_MS = 600L
            override fun onServiceConnected() { super.onServiceConnected() }
            override fun onKeyEvent(event: KeyEvent?): Boolean {
                if (event?.keyCode == KeyEvent.KEYCODE_BACK) {
                    when (event.action) {
                        KeyEvent.ACTION_DOWN -> {
                            backPressStartTime = System.currentTimeMillis()
                            handler.postDelayed({
                                val duration = System.currentTimeMillis() - backPressStartTime
                                if (duration >= LONG_PRESS_DELAY_MS - 50) killForegroundApp()
                            }, LONG_PRESS_DELAY_MS)
                        }
                        KeyEvent.ACTION_UP -> handler.removeCallbacksAndMessages(null)
                    }
                }
                return false
            }
            private fun killForegroundApp() {
                try {
                    val am = getSystemService(Context.ACTIVITY_SERVICE) as ActivityManager
                    if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                        val currentApp = am.runningAppProcesses?.firstOrNull { 
                            it.importance == ActivityManager.RunningAppProcessInfo.IMPORTANCE_FOREGROUND 
                        }
                        currentApp?.let {
                            Runtime.getRuntime().exec(arrayOf("su", "-c", "am force-stop ${it.processName}"))
                        }
                    }
                } catch(e: Exception) { }
            }
            override fun onInterrupt() {}
        }
        EOF
        
        # accessibility_service_config.xml
        cat > app/src/main/res/xml/accessibility_service_config.xml << 'EOF'
        <?xml version="1.0" encoding="utf-8"?>
        <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
            android:accessibilityEventTypes="typeAllMask"
            android:accessibilityFeedbackType="feedbackGeneric"
            android:accessibilityFlags="flagReportViewIds"
            android:canPerformGestures="true"
            android:canRetrieveWindowContent="true"
            android:description="Long press BACK button to force kill current app"
            android:notificationTimeout="100" />
        EOF
        
        # strings.xml
        cat > app/src/main/res/values/strings.xml << 'EOF'
        <?xml version="1.0" encoding="utf-8"?>
        <resources>
            <string name="app_name">Long Press Kill</string>
        </resources>
        EOF
        
        # build.gradle (app level)
        cat > app/build.gradle << 'EOF'
        plugins {
            id 'com.android.application'
            id 'kotlin-android'
        }
        android {
            namespace 'com.freestyle.longpresskill'
            compileSdk 34
            defaultConfig {
                applicationId "com.freestyle.longpresskill"
                minSdk 29
                targetSdk 34
                versionCode 1
                versionName "1.0"
            }
            compileOptions {
                sourceCompatibility JavaVersion.VERSION_11
                targetCompatibility JavaVersion.VERSION_11
            }
            kotlinOptions {
                jvmTarget = '11'
            }
        }
        dependencies {
            implementation 'androidx.core:core-ktx:1.12.0'
            implementation 'androidx.appcompat:appcompat:1.6.1'
        }
        EOF
        
        # build.gradle (root)
        cat > build.gradle << 'EOF'
        buildscript {
            ext.kotlin_version = '1.9.0'
            repositories {
                google()
                mavenCentral()
            }
            dependencies {
                classpath 'com.android.tools.build:gradle:8.1.4'
                classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
            }
        }
        allprojects {
            repositories {
                google()
                mavenCentral()
            }
        }
        task clean(type: Delete) {
            delete rootProject.buildDir
        }
        EOF
        
        # settings.gradle
        cat > settings.gradle << 'EOF'
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "LongPressKill"
        include ':app'
        EOF
        
        # gradle-wrapper.properties
        cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
        distributionBase=GRADLE_USER_HOME
        distributionPath=wrapper/dists
        distributionUrl=https\://services.gradle.org/distributions/gradle-8.2-bin.zip
        zipStoreBase=GRADLE_USER_HOME
        zipStorePath=wrapper/dists
        EOF
        
        echo "✅ Project created successfully"
        
    - name: Grant execute permission for gradlew
      run: |
        cd LongPressKillApp
        # Download gradle wrapper script
        wget -q https://raw.githubusercontent.com/gradle/gradle/v8.2.0/gradle/wrapper/gradle-wrapper.jar -O gradle/wrapper/gradle-wrapper.jar
        cat > gradlew << 'EOF'
        #!/bin/sh
        exec gradle "$@"
        EOF
        chmod +x gradlew
        cd ..
        
    - name: Build APK with gradle
      run: |
        cd LongPressKillApp
        # Use gradle from PATH
        gradle wrapper --gradle-version 8.2
        ./gradlew assembleDebug --no-daemon --stacktrace
        
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: LongPressKill-HardMode
        path: LongPressKillApp/app/build/outputs/apk/debug/*.apk
