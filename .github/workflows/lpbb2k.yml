name: Build APK - LongPressKill (Final Fix)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Create Project Structure & Write Code
        run: |
          mkdir -p app/src/main/java/com/freestyle/longpresskill
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/values
          
          # 1. strings.xml
          cat > app/src/main/res/values/strings.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Long Press Kill</string>
              <string name="accessibility_desc">Tahan tombol BACK 0.6 detik untuk kill aplikasi (Root).</string>
          </resources>
          EOF
          
          # 2. AndroidManifest.xml (tanpa package attribute biar gak deprecated)
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.KILL_BACKGROUND_PROCESSES" />
              <application
                  android:allowBackup="true"
                  android:icon="@android:drawable/ic_menu_close_clear_cancel"
                  android:label="@string/app_name"
                  android:theme="@android:style/Theme.DeviceDefault.Light.DarkActionBar">
                  <activity android:name=".MainActivity"
                      android:exported="true"
                      android:label="@string/app_name">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".LongPressKillService"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_service_config" />
                  </service>
              </application>
          </manifest>
          EOF
          
          # 3. MainActivity.kt
          cat > app/src/main/java/com/freestyle/longpresskill/MainActivity.kt << 'EOF'
          package com.freestyle.longpresskill
          import android.os.Bundle
          import android.provider.Settings
          import android.content.Intent
          import android.widget.Button
          import android.widget.TextView
          import android.widget.LinearLayout
          import android.app.Activity
          
          class MainActivity : Activity() {
              private lateinit var statusText: TextView
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val layout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(50, 50, 50, 50)
                  }
                  statusText = TextView(this).apply {
                      text = "Status: Checking..."
                      textSize = 18f
                      setPadding(0, 0, 0, 50)
                  }
                  val btn = Button(this).apply {
                      text = "Buka Aksesibilitas"
                      setOnClickListener {
                          startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                      }
                  }
                  layout.addView(statusText)
                  layout.addView(btn)
                  setContentView(layout)
              }
              override fun onResume() {
                  super.onResume()
                  val service = "${packageName}/${LongPressKillService::class.java.name}"
                  val isEnabled = Settings.Secure.getString(contentResolver, Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES)?.contains(service) == true
                  statusText.text = "Status: ${if (isEnabled) "AKTIF ✅" else "MATI ❌"}\n\nTahan BACK 0.6s untuk kill app."
              }
          }
          EOF
          
          # 4. LongPressKillService.kt (DIPERBAIKI: import AccessibilityEvent yang benar)
          cat > app/src/main/java/com/freestyle/longpresskill/LongPressKillService.kt << 'EOF'
          package com.freestyle.longpresskill
          import android.accessibilityservice.AccessibilityService
          import android.view.accessibility.AccessibilityEvent
          import android.app.ActivityManager
          import android.content.Context
          import android.os.Handler
          import android.os.Looper
          import android.view.KeyEvent
          
          class LongPressKillService : AccessibilityService() {
              private var startTime = 0L
              private val handler = Handler(Looper.getMainLooper())
              
              override fun onAccessibilityEvent(event: AccessibilityEvent?) {
                  // Tidak perlu diproses, karena kita hanya butuh key events
              }
              
              override fun onKeyEvent(event: KeyEvent?): Boolean {
                  if (event?.keyCode == KeyEvent.KEYCODE_BACK) {
                      if (event.action == KeyEvent.ACTION_DOWN) {
                          if (startTime == 0L) {
                              startTime = System.currentTimeMillis()
                              handler.postDelayed({
                                  if (startTime != 0L) killApp()
                              }, 600)
                          }
                      } else if (event.action == KeyEvent.ACTION_UP) {
                          startTime = 0L
                          handler.removeCallbacksAndMessages(null)
                      }
                  }
                  return false
              }
              
              private fun killApp() {
                  val am = getSystemService(Context.ACTIVITY_SERVICE) as ActivityManager
                  am.runningAppProcesses?.firstOrNull { it.importance == 100 }?.let {
                      if (it.processName != packageName) {
                          Runtime.getRuntime().exec(arrayOf("su", "-c", "am force-stop ${it.processName}"))
                      }
                  }
              }
              
              override fun onInterrupt() {}
          }
          EOF
          
          # 5. accessibility_service_config.xml
          cat > app/src/main/res/xml/accessibility_service_config.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeAllMask"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagRequestFilterKeyEvents"
              android:canRequestFilterKeyEvents="true"
              android:description="@string/accessibility_desc"
              android:notificationTimeout="100" />
          EOF
          
          # 6. build.gradle (root)
          cat > build.gradle << 'EOF'
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.1.1'
                  classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.0"
              }
          }
          allprojects { repositories { google(); mavenCentral() } }
          EOF
          
          # 7. app/build.gradle (dengan compileOptions & kotlinOptions)
          cat > app/build.gradle << 'EOF'
          plugins { id 'com.android.application'; id 'kotlin-android' }
          android {
              namespace 'com.freestyle.longpresskill'
              compileSdk 34
              defaultConfig {
                  applicationId "com.freestyle.longpresskill"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }
          dependencies { implementation "org.jetbrains.kotlin:kotlin-stdlib:1.9.0" }
          EOF
          
          echo "include ':app'" > settings.gradle
          echo "android.useAndroidX=true" > gradle.properties

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK Platform 34 & Build Tools
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Generate Gradle Wrapper (Gradle 8.1.1)
        run: |
          wget https://services.gradle.org/distributions/gradle-8.1.1-bin.zip
          unzip -q gradle-8.1.1-bin.zip
          ./gradle-8.1.1/bin/gradle wrapper --gradle-version 8.1.1
          rm -rf gradle-8.1.1-bin.zip gradle-8.1.1

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LongPressKill-debug
          path: app/build/outputs/apk/debug/*.apk
