name: Create Patched vbmeta.tar

on:
  workflow_dispatch:

jobs:
  patch-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y lz4 tar

      - name: Extract, Patch, and Package
        run: |
          # 1. Decompress lz4 to img
          if [ -f "vbmeta.img.lz4" ]; then
            lz4 -d vbmeta.img.lz4 vbmeta.img
          else
            echo "vbmeta.img.lz4 not found!"
            exit 1
          fi

          # 2. Patch the vbmeta.img
          # We use a standard byte-patching approach (offset 123 is a common location for AVB flags)
          python3 -c "
          with open('vbmeta.img', 'rb+') as f:
              f.seek(123)
              f.write(b'\x03')
          "

          # 3. Create tar for Odin
          # Odin expects the file inside to be named exactly 'vbmeta.img'
          tar -cvf vbmeta.tar vbmeta.img

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: patched-vbmeta-tar
          path: vbmeta.tar
